<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1620" viewBox="0 0 1250 1620"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1250" height="1620" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="625" y="44" text-anchor="middle" font-size="27">编译任务与等待：源码 → 延迟任务 / 立即对象 → scope 中的可用入口</text><rect x="70" y="90" width="1000" height="110" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="570" y="125" text-anchor="middle" font-size="25">输入：生成模块初始化期间的 kernel 编译声明</text><text x="570" y="165" text-anchor="middle" font-size="22">例如 cpp_pybinding(argtypes, source) 或 triton(name, source)</text><rect x="70" y="250" width="1000" height="165" rx="24" fill="#e1f2ff" stroke="#368dc0" stroke-width="3"/><text x="570" y="285" text-anchor="middle" font-size="25">① 编译入口与后端任务</text><text x="570" y="325" text-anchor="middle" font-size="22">CPU C++ / Halide：组织缓存加载，返回立即入口或 LambdaFuture</text><text x="570" y="356" text-anchor="middle" font-size="22">CUDA / ROCm C++：submit 线程任务；Triton：看进程池是否就绪</text><text x="570" y="387" text-anchor="middle" font-size="22">线程数 ≤ 1 时，相应编译入口走同步分支</text><rect x="70" y="475" width="1000" height="180" rx="24" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="570" y="510" text-anchor="middle" font-size="25">② 线程池、进程池与 worker：只对相应异步路径</text><text x="570" y="550" text-anchor="middle" font-size="22">submit → 同进程线程池；Triton 就绪路径 → 编译进程池</text><text x="570" y="581" text-anchor="middle" font-size="22">C++ worker 形成二进制；Triton worker 只 warm_cache_only 预编译</text><text x="570" y="612" text-anchor="middle" font-size="22">返回 Future；任务可与其余模块初始化交错，不在此执行模型</text><rect x="70" y="725" width="1000" height="140" rx="24" fill="#fff6cf" stroke="#d6a000" stroke-width="3"/><text x="570" y="760" text-anchor="middle" font-size="25">生成模块保存任务，再调用 wait(scope)</text><text x="570" y="800" text-anchor="middle" font-size="22">scope 中混有普通对象、Future、CodeCacheFuture</text><text x="570" y="831" text-anchor="middle" font-size="22">①的立即结果同样放入 scope；它不需要解析 Future</text><rect x="70" y="925" width="1000" height="185" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="570" y="960" text-anchor="middle" font-size="25">③ Future 解析与 scope 交接：需要入口时消费</text><text x="570" y="1000" text-anchor="middle" font-size="22">线程数 &gt; 1：逐个取顶层 Future.result()，替换同名 scope 项</text><text x="570" y="1031" text-anchor="middle" font-size="22">C++：等待编译、按需装载；Triton：先等 worker，再主进程 precompile</text><text x="570" y="1062" text-anchor="middle" font-size="22">失败立即抛出；已替换的前项保留，后项还未访问</text><rect x="70" y="1175" width="1000" height="130" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="570" y="1210" text-anchor="middle" font-size="25">输出：当前模块 scope 中的后端对象 / 可调用入口</text><text x="570" y="1250" text-anchor="middle" font-size="22">wait 本身返回 None；不会递归处理容器内的 Future</text><text x="570" y="1281" text-anchor="middle" font-size="22">线程数 ≤ 1：wait 不解析 Future，正常入口已同步完成</text><rect x="70" y="1370" width="1000" height="110" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="570" y="1405" text-anchor="middle" font-size="25">之后调用模型：wrapper 才使用这些入口执行张量计算</text><text x="570" y="1445" text-anchor="middle" font-size="22">新设备需要另外提供相应编译器、装载及 runtime launch 实现</text><path d="M570 200 V250" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M570 415 V475" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M570 865 V925" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M570 1110 V1175" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M570 1305 V1370" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M570 655 V725" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#a)"/><text x="770" y="695" text-anchor="middle" font-size="17">提交后保存任务；虚线不是阻塞等待</text><path d="M1070 335 H1135 V795 H1070" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="1150" y="520" font-size="18">同步 /</text><text x="1150" y="550" font-size="18">未就绪</text><text x="1150" y="580" font-size="18">立即结果</text><text x="625" y="1555" text-anchor="middle" font-size="19">①②③对应三个直接子模块。共享源码/二进制缓存服务①与③，在相邻缓存篇展开。</text></g></svg>