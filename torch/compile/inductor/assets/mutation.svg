<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1030" viewBox="0 0 1100 1030"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1030" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="40" text-anchor="middle" font-size="30">写入恢复：合法性判断先于删 clone 和 copy</text><text x="550" y="95" text-anchor="middle" font-size="23">输入：主要重写完成并补齐属性的图</text><rect x="45" y="130" width="1010" height="710" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="110" y="155" width="880" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550" y="189" text-anchor="middle" font-size="23">① View/scatter 表示与分解 · 统一表示</text><text x="550" y="227" text-anchor="middle" font-size="21">记录 base 和有序 view 链</text><text x="550" y="259" text-anchor="middle" font-size="21">构造可统一分析的 generalized scatter</text><path d="M550 280 V333" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="335" width="880" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="369" text-anchor="middle" font-size="23">② 存储可写性与原地化</text><text x="550" y="407" text-anchor="middle" font-size="21">检查共享存储、后续旧值读取、输入回写意图</text><text x="550" y="439" text-anchor="middle" font-size="21">改 target / 引用，或写入保留 clone 清单</text><path d="M550 460 V513" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="515" width="880" height="125" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="550" y="549" text-anchor="middle" font-size="23">① View/scatter 表示与分解 · 恢复操作</text><text x="550" y="587" text-anchor="middle" font-size="21">根据判定选择功能式或写入式分解</text><text x="550" y="619" text-anchor="middle" font-size="21">交回正常的 view / scatter / copy 节点</text><path d="M550 640 V693" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="695" width="880" height="125" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="550" y="729" text-anchor="middle" font-size="23">③ 自动功能化包装分解</text><text x="550" y="767" text-anchor="middle" font-size="21">按 clone 清单展开高阶包装</text><text x="550" y="799" text-anchor="middle" font-size="21">移除 auto_functionalized / Triton functional wrapper</text><text x="550" y="935" text-anchor="middle" font-size="21">输出：保留正确输入修改与别名的图；再交图收尾</text><text x="550" y="982" text-anchor="middle" font-size="18">实线：编译期间交接；同一编号重复出现表示同一模块再次参与</text></g></svg>