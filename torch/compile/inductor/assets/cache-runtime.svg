<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1170" viewBox="0 0 1100 1170"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1170" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="42" text-anchor="middle" font-size="29">缓存：先判断适用性，再恢复或正常编译</text><text x="550" y="95" text-anchor="middle" font-size="21">输入：gm、编译示例、配置和当前 tracing context</text><rect x="30" y="130" width="1040" height="910" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="220" y="155" width="660" height="120" rx="22" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550.0" y="191" text-anchor="middle" font-size="23">① 键与候选适用性</text><text x="550.0" y="230" text-anchor="middle" font-size="20">能否缓存、图与输入描述、配置、候选 guards</text><text x="550.0" y="262" text-anchor="middle" font-size="20">查询结果为 hit、miss 或 bypass</text><path d="M550 275 V330 H287 V440" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M550 330 H812 V440" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><text x="170" y="395" text-anchor="middle" font-size="19">hit</text><text x="930" y="395" text-anchor="middle" font-size="19">miss / bypass</text><rect x="60" y="440" width="455" height="145" rx="22" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="287.5" y="476" text-anchor="middle" font-size="23">② 恢复与持久化 · 恢复</text><text x="287.5" y="515" text-anchor="middle" font-size="20">反序列化程序描述；检查适用条件</text><text x="287.5" y="547" text-anchor="middle" font-size="20">加载源码模块，建立 current_callable</text><text x="287.5" y="579" text-anchor="middle" font-size="20">使用本进程入口，不是保存的函数地址</text><rect x="585" y="440" width="455" height="145" rx="22" fill="#fafafa" stroke="#666" stroke-width="3"/><text x="812.5" y="476" text-anchor="middle" font-size="23">共享协作：正常单图编译</text><text x="812.5" y="515" text-anchor="middle" font-size="20">实际经过图准备、Lowering、调度与生成</text><text x="812.5" y="547" text-anchor="middle" font-size="20">由本系列其他模块交回 CompiledFxGraph</text><path d="M812 585 V650" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="585" y="650" width="455" height="120" rx="22" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="812.5" y="686" text-anchor="middle" font-size="23">② 恢复与持久化 · 保存</text><text x="812.5" y="725" text-anchor="middle" font-size="20">可缓存 miss 保存源码、元数据和 guards</text><text x="812.5" y="757" text-anchor="middle" font-size="20">bypass 不按这条普通保存路径缓存</text><path d="M287 585 V820 H425 V870" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M812 770 V820 H675 V870" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="220" y="870" width="660" height="140" rx="22" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="550.0" y="906" text-anchor="middle" font-size="23">③ 调用适配与 CUDA Graph</text><text x="550.0" y="945" text-anchor="middle" font-size="20">回填 stride；按条件捕获 / 禁用 CUDA Graph</text><text x="550.0" y="977" text-anchor="middle" font-size="20">处理输入对齐；返回当前环境可调用图</text><text x="550" y="1090" text-anchor="middle" font-size="21">之后才用真实输入调用：hit / miss / bypass 都计算本次结果</text><text x="550" y="1140" text-anchor="middle" font-size="18">实线为编译 / 恢复期间交接；共享编译流程保留原模块归属</text></g></svg>