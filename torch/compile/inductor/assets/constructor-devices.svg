<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1470" viewBox="0 0 1200 1470"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1200" height="1470" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="600" y="43" text-anchor="middle" font-size="29">构造节点设备迁移：从使用链分析到只改 device 参数</text><text x="600" y="94" text-anchor="middle" font-size="20">本图表示 FX 改写；所有实验使用 FakeTensor，不发生真实 GPU 分配</text><rect x="30" y="120" width="1140" height="1230" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="160" y="155" width="880" height="155" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="600.0" y="190" text-anchor="middle" font-size="23">扫描候选和目标设备</text><text x="600.0" y="233" text-anchor="middle" font-size="19">ATen / prims 构造，且 kwargs.device 精确等于 torch.device(&quot;cpu&quot;)</text><text x="600.0" y="263" text-anchor="middle" font-size="19">从 Tensor metadata 收集目标设备；没有候选或目标数量不为 1 → 返回</text><text x="600.0" y="293" text-anchor="middle" font-size="19">已有 cuda:0 与 cuda:1 算两个设备</text><rect x="160" y="370" width="880" height="155" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="600.0" y="405" text-anchor="middle" font-size="23">建立 CPU 入度、来源依赖与构造关联组</text><text x="600.0" y="448" text-anchor="middle" font-size="20">cpu_indeg 按参数出现次数计数；每个构造先依赖自己</text><text x="600.0" y="478" text-anchor="middle" font-size="20">构造节点放入工作栈；关联组用于共同阻断</text><text x="600.0" y="508" text-anchor="middle" font-size="20">constructor_dependencies 保存每条已到达路径的构造来源</text><rect x="160" y="585" width="880" height="185" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="600.0" y="620" text-anchor="middle" font-size="23">逐个弹出节点，检查每个使用者</text><text x="600.0" y="663" text-anchor="middle" font-size="18">遇到输出保护、自定义 target、特殊 index_put 等阻断：记录来源并停止该节点</text><text x="600.0" y="693" text-anchor="middle" font-size="18">允许 CPU 输入且已输出目标设备：终止这条迁移传播</text><text x="600.0" y="723" text-anchor="middle" font-size="18">其余使用者 CPU 入度减 1；到 0 才加入工作栈</text><text x="600.0" y="753" text-anchor="middle" font-size="18">合并当前来源和使用者来源，保留关联构造集合</text><path d="M600 310 V370" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M600 525 V585" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><rect x="160" y="845" width="880" height="125" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="600.0" y="880" text-anchor="middle" font-size="23">工作栈处理完：汇总不能迁移的来源</text><text x="600.0" y="923" text-anchor="middle" font-size="19">CPU 入度残留会阻断已关联构造；再扩散到等价关联组</text><text x="600.0" y="953" text-anchor="middle" font-size="19">movable=所有候选减去阻断集合</text><path d="M600 770 V845" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M160 690 H45 V550 H600 V585" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)" stroke-dasharray="8 6"/><text x="95" y="800" text-anchor="middle" font-size="17">继续弹栈</text><rect x="160" y="1040" width="880" height="155" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="600.0" y="1075" text-anchor="middle" font-size="23">只对可迁移构造改 kwargs.device</text><text x="600.0" y="1118" text-anchor="middle" font-size="20">复制 kwargs，将 device 设为唯一目标设备，再赋回节点</text><text x="600.0" y="1148" text-anchor="middle" font-size="20">节点身份与原 metadata 不自动改变</text><text x="600.0" y="1178" text-anchor="middle" font-size="20">调用方随后增量更新属性，再做写入恢复与入口收尾</text><path d="M600 970 V1040" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><text x="600" y="1395" text-anchor="middle" font-size="19">allow_outputs 默认 False；只能说明本 pass 是否改写，不能由此推断已验证 GPU 性能</text><text x="600" y="1440" text-anchor="middle" font-size="18">实线：本轮处理；虚线：继续扫描；条件和失败出口以文字标明</text></g></svg>