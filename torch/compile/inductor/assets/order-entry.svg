<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1540" viewBox="0 0 1200 1540"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1200" height="1540" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="600" y="43" text-anchor="middle" font-size="29">顺序与入口一致性：先修数据顺序，最后刷新 forward</text><text x="600" y="94" text-anchor="middle" font-size="20">排序只修改节点链表；不改变算子参数、metadata 或数值意图</text><rect x="30" y="120" width="1140" height="1300" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="160" y="155" width="880" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="600.0" y="190" text-anchor="middle" font-size="23">建立三个集合与游标</text><text x="600.0" y="233" text-anchor="middle" font-size="20">pending=逆序节点列表；ready=空；waiting=依赖→使用者</text><text x="600.0" y="263" text-anchor="middle" font-size="20">cursor=None；pop 从原图前端的候选开始</text><rect x="160" y="355" width="880" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="600.0" y="390" text-anchor="middle" font-size="23">弹出一个节点，检查 args / kwargs 中的输入</text><text x="600.0" y="433" text-anchor="middle" font-size="20">_args 递归收集 Node，保留重复；常量不形成等待项</text><text x="600.0" y="463" text-anchor="middle" font-size="20">waiting_for=尚未进入 ready 的输入节点</text><rect x="70" y="595" width="470" height="155" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="305.0" y="630" text-anchor="middle" font-size="23">有未就绪输入：挂起</text><text x="305.0" y="673" text-anchor="middle" font-size="20">等待 waiting_for 最后一项</text><text x="305.0" y="703" text-anchor="middle" font-size="20">waiting[该输入].append(当前节点)</text><text x="305.0" y="733" text-anchor="middle" font-size="20">暂不移动当前节点</text><rect x="660" y="595" width="470" height="155" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="895.0" y="630" text-anchor="middle" font-size="23">全部输入就绪：放到正确位置</text><text x="895.0" y="673" text-anchor="middle" font-size="18">加入 ready，必要时接到 cursor 后</text><text x="895.0" y="703" text-anchor="middle" font-size="18">更新 cursor，唤醒等待此节点的用户</text><text x="895.0" y="733" text-anchor="middle" font-size="18">唤醒列表反转后加入 pending</text><path d="M600 280 V355" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M600 480 V535 H305 V595" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M600 535 H895 V595" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M305 750 V810 H600 V860" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M895 750 V810 H600 V860" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><rect x="160" y="860" width="880" height="125" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="600.0" y="895" text-anchor="middle" font-size="23">pending 仍有节点就继续；否则检查结束条件</text><text x="600.0" y="938" text-anchor="middle" font-size="20">waiting 必须为空，ready 必须覆盖整个图</text><text x="600.0" y="968" text-anchor="middle" font-size="20">循环引用或外图依赖未解决 → AssertionError</text><path d="M160 920 H45 V320 H600 V355" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)" stroke-dasharray="8 6"/><text x="102" y="560" text-anchor="middle" font-size="18">继续</text><rect x="160" y="1060" width="880" height="115" rx="23" fill="#f4f4f4" stroke="#888" stroke-width="3"/><text x="600.0" y="1095" text-anchor="middle" font-size="23">交回 post-grad 的跨模块处理</text><text x="600.0" y="1138" text-anchor="middle" font-size="20">设备迁移 → 增量属性更新 → 写入 / 通信恢复</text><rect x="160" y="1240" width="880" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="600.0" y="1275" text-anchor="middle" font-size="23">最后 recompile、记录图、lint</text><text x="600.0" y="1318" text-anchor="middle" font-size="20">recompile 刷新 FX Python forward，不是编译 kernel</text><text x="600.0" y="1348" text-anchor="middle" font-size="20">lint 检查结构，不证明数值、别名或写入次序正确</text><path d="M600 985 V1060" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M600 1175 V1240" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><text x="600" y="1465" text-anchor="middle" font-size="19">已经合法的顺序保持不变；未编码为数据依赖的副作用先后不由排序器修复</text><text x="600" y="1510" text-anchor="middle" font-size="18">实线：本轮处理；虚线：继续扫描；条件和失败出口以文字标明</text></g></svg>