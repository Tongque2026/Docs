<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1470" viewBox="0 0 1000 1470"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1000" height="1470" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#202020"><text x="500" y="42" text-anchor="middle" font-size="30" font-weight="bold">Inductor：从一张 FX 图到可调用程序</text><rect x="225" y="75" width="550" height="100" rx="22" fill="#fafafa" stroke="#555" stroke-width="3"/><text x="500.0" y="111" text-anchor="middle" font-size="22" font-weight="normal">输入：GraphModule + example_inputs</text><text x="500.0" y="143" text-anchor="middle" font-size="22" font-weight="normal">一张 forward / backward / inference 图</text><rect x="35" y="215" width="930" height="950" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><text x="160" y="253" text-anchor="middle" font-size="24" font-weight="bold">Inductor 内部</text><rect x="205" y="280" width="590" height="105" rx="22" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="500.0" y="316" text-anchor="middle" font-size="22" font-weight="normal">① 图准备</text><text x="500.0" y="348" text-anchor="middle" font-size="22" font-weight="normal">形状传播、Post-grad Passes → 整理后的 FX 图</text><rect x="205" y="440" width="590" height="120" rx="22" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="500.0" y="476" text-anchor="middle" font-size="22" font-weight="normal">② Lowering</text><text x="500.0" y="508" text-anchor="middle" font-size="22" font-weight="normal">GraphLowering.run → 计算、布局、存储的 IR</text><text x="500.0" y="540" text-anchor="middle" font-size="22" font-weight="normal">状态保存在 GraphLowering 对象上</text><rect x="205" y="620" width="590" height="105" rx="22" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="500.0" y="656" text-anchor="middle" font-size="22" font-weight="normal">③ 调度与融合</text><text x="500.0" y="688" text-anchor="middle" font-size="22" font-weight="normal">Scheduler → 依赖、融合分组、最后使用位置</text><rect x="205" y="810" width="590" height="145" rx="22" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="500.0" y="846" text-anchor="middle" font-size="22" font-weight="normal">④ 代码生成与运行封装</text><text x="500.0" y="878" text-anchor="middle" font-size="22" font-weight="normal">设备 kernel / 外部调用 + wrapper</text><text x="500.0" y="910" text-anchor="middle" font-size="22" font-weight="normal">编译、加载 → module.call</text><rect x="205" y="1000" width="590" height="115" rx="22" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="500.0" y="1036" text-anchor="middle" font-size="22" font-weight="normal">运行封装的出口</text><text x="500.0" y="1068" text-anchor="middle" font-size="22" font-weight="normal">CompiledFxGraph(current_callable, 元数据)</text><text x="500.0" y="1100" text-anchor="middle" font-size="22" font-weight="normal">缓存恢复后同样完成运行适配</text><path d="M500 175 L500 280" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 385 L500 440" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 560 L500 620" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 725 L500 810" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/><text x="855" y="750" text-anchor="middle" font-size="16" font-weight="normal">Scheduler.codegen</text><text x="855" y="782" text-anchor="middle" font-size="16" font-weight="normal">驱动后端生成</text><path d="M500 955 L500 1000" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 195 H110 V1055 H205" fill="none" stroke="#555" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="840" y="1195" text-anchor="middle" font-size="16" font-weight="normal">虚线：缓存命中</text><text x="840" y="1227" text-anchor="middle" font-size="16" font-weight="normal">跳过重新编译</text><text x="855" y="520" text-anchor="middle" font-size="18" font-weight="normal">共享支撑</text><text x="855" y="552" text-anchor="middle" font-size="18" font-weight="normal">FX 图缓存</text><text x="855" y="584" text-anchor="middle" font-size="18" font-weight="normal">入口先查</text><text x="855" y="616" text-anchor="middle" font-size="18" font-weight="normal">出口保存</text><rect x="225" y="1230" width="550" height="85" rx="22" fill="#efe2ff" stroke="#9752c5" stroke-width="3"/><text x="500.0" y="1266" text-anchor="middle" font-size="22" font-weight="normal">返回：可调用程序（尚非计算结果）</text><path d="M500 1115 L500 1230" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/><rect x="225" y="1370" width="550" height="70" rx="22" fill="#fafafa" stroke="#555" stroke-width="3"/><text x="500.0" y="1406" text-anchor="middle" font-size="22" font-weight="normal">之后调用：真实输入 → 输出张量 / 输入更新</text><path d="M500 1315 L500 1370" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/></g></svg>