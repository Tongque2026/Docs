<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="850" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="40" text-anchor="middle" font-size="30">依赖构建：读写、版本、活跃性和合法顺序</text><text x="550" y="95" text-anchor="middle" font-size="23">输入：graph.operations 与图输入 / 输出状态</text><rect x="45" y="130" width="1010" height="530" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="110" y="155" width="880" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550" y="189" text-anchor="middle" font-size="23">① 读写提取与调度节点</text><text x="550" y="227" text-anchor="middle" font-size="21">构造 SchedulerNode / Extern 等节点</text><text x="550" y="259" text-anchor="middle" font-size="21">读取 LoopBody 或记录访存；去掉入口已满足等待</text><path d="M550 280 V333" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="335" width="880" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="369" text-anchor="middle" font-size="23">② 别名、写入与符号依赖</text><text x="550" y="407" text-anchor="middle" font-size="21">合并共享存储用户；补旧读者 → 写者边</text><text x="550" y="439" text-anchor="middle" font-size="21">登记修改版本和符号定义；标记输出与输入修改</text><path d="M550 460 V513" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="515" width="880" height="125" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="550" y="549" text-anchor="middle" font-size="23">③ 排序、活跃性与祖先关系</text><text x="550" y="587" text-anchor="middle" font-size="21">拓扑排序；删除没有有效结果需求的节点</text><text x="550" y="619" text-anchor="middle" font-size="21">清除无效 WeakDep；递推 ancestors 供融合使用</text><text x="550" y="755" text-anchor="middle" font-size="21">输出：带依赖、用户、版本映射和祖先信息的 self.nodes</text><text x="550" y="802" text-anchor="middle" font-size="18">实线：编译期间交接；同一编号重复出现表示同一模块再次参与</text></g></svg>