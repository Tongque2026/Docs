<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1200" height="1420" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="600" y="43" text-anchor="middle" font-size="29">View/scatter：先合并更新路径，再按选定语义展开</text><text x="600" y="94" text-anchor="middle" font-size="21">输入：有 metadata 的 FX 图；最终输出：普通 ATen 操作组成的同一张图</text><rect x="35" y="120" width="1130" height="1210" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="160" y="155" width="880" height="155" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="600.0" y="190" text-anchor="middle" font-size="24">canonicalize_view_scatter_ops：扫描并记录视图路径</text><text x="600.0" y="233" text-anchor="middle" font-size="20">保存 node→base 与 node→ViewOp 列表</text><text x="600.0" y="263" text-anchor="middle" font-size="20">普通 scatter → 一步广义 scatter；可对接的嵌套更新 → 路径合并</text><text x="600.0" y="293" text-anchor="middle" font-size="20">内层结果仍被使用时，改接为合并结果的对应 view</text><rect x="160" y="365" width="880" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="600.0" y="400" text-anchor="middle" font-size="24">广义 scatter：inp、src、view_ops</text><text x="600.0" y="443" text-anchor="middle" font-size="20">功能式：clone base 后沿路径 copy；原地式：直接写 base</text><text x="600.0" y="473" text-anchor="middle" font-size="20">graph_call_function 在创建节点时计算 FakeTensor metadata</text><rect x="160" y="545" width="880" height="125" rx="23" fill="#f4f4f4" stroke="#888" stroke-width="3"/><text x="600.0" y="580" text-anchor="middle" font-size="24">外部协作：存储可写性与原地化核心</text><text x="600.0" y="623" text-anchor="middle" font-size="20">可写性判断结合 should_reinplace_scatter 的策略</text><text x="600.0" y="653" text-anchor="middle" font-size="20">允许复用时把功能 target 改为原地 target；否则保留</text><rect x="160" y="725" width="880" height="125" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="600.0" y="760" text-anchor="middle" font-size="24">decompose_generalized_scatter：读取已选定的 target</text><text x="600.0" y="803" text-anchor="middle" font-size="20">原地 target，或路径含 as_strided / diagonal → 写入分解</text><text x="600.0" y="833" text-anchor="middle" font-size="20">其余功能 target → 递归回填分解；这里不再做可写性判断</text><rect x="65" y="965" width="500" height="165" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="315.0" y="1000" text-anchor="middle" font-size="24">功能式分解</text><text x="315.0" y="1043" text-anchor="middle" font-size="20">沿外层 view 递归进入目标区域</text><text x="315.0" y="1073" text-anchor="middle" font-size="20">最内层 scatter 更新，再逐层 scatter 回填</text><text x="315.0" y="1103" text-anchor="middle" font-size="20">结果是新的 base；不修改原输入</text><rect x="635" y="965" width="500" height="165" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="885.0" y="1000" text-anchor="middle" font-size="24">写入分解</text><text x="885.0" y="1043" text-anchor="middle" font-size="20">功能 target：先 clone；原地 target：不 clone</text><text x="885.0" y="1073" text-anchor="middle" font-size="20">按 view_ops 顺序找目标，最后 copy_(src)</text><text x="885.0" y="1103" text-anchor="middle" font-size="20">返回完整 base，不把最后一个 view 当结果</text><rect x="160" y="1210" width="880" height="95" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="600.0" y="1245" text-anchor="middle" font-size="24">重接广义节点的使用者，再删除旧节点</text><text x="600.0" y="1288" text-anchor="middle" font-size="20">正常结束返回 None；新节点带 val，随后才进行最终 recompile</text><path d="M600 310 V365" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M600 490 V545" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M600 670 V725" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M600 850 V900 H315 V965" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M600 900 H885 V965" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><text x="315" y="938" text-anchor="middle" font-size="18">功能 target 且不强制 mutation</text><text x="885" y="938" text-anchor="middle" font-size="18">原地 target 或强制 mutation</text><path d="M315 1130 V1170 H440 V1210" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M885 1130 V1170 H760 V1210" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><text x="600" y="1375" text-anchor="middle" font-size="19">实线：改图期间交接。灰框归兄弟模块；广义节点是临时表示，不是最终可生成的 forward</text></g></svg>