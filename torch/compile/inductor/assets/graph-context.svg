<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1530" viewBox="0 0 1250 1530"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1250" height="1530" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="625" y="45" text-anchor="middle" font-size="29">图上下文与符号状态：同一张图持续积累编译结果</text><rect x="90" y="90" width="1000" height="125" rx="24" fill="#f3f3f3" stroke="#888" stroke-width="3"/><text x="590" y="126" text-anchor="middle" font-size="25">输入：gm + 示例输入 + ShapeEnv（可选）+ 编译模式</text><text x="590" y="166" text-anchor="middle" font-size="21">收到已有环境就复用；没有就创建本图环境</text><text x="590" y="197" text-anchor="middle" font-size="21">调用者先安装 V.fake_mode；示例提供设备、尺寸与步长</text><rect x="35" y="255" width="1110" height="940" rx="32" fill="#fff9d9" stroke="#d6a000" stroke-width="3"/><rect x="90" y="285" width="1000" height="165" rx="24" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="590" y="321" text-anchor="middle" font-size="25">建立 GraphLowering 状态</text><text x="590" y="361" text-anchor="middle" font-size="21">冻结新增 deferred assert；浅复制等待表，建立 SizeVarAllocator</text><text x="590" y="392" text-anchor="middle" font-size="21">初始化输入 / 常量 / buffer / operation / 名称映射</text><text x="590" y="423" text-anchor="middle" font-size="21">const_module 共享部分容器；make_subgraph 另建状态、复用 ShapeEnv</text><rect x="90" y="510" width="1000" height="135" rx="24" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="590" y="546" text-anchor="middle" font-size="25">构造完成后，调用者安装 V.graph 作用域</text><text x="590" y="586" text-anchor="middle" font-size="21">Virtualized 通过 threading.local 找到当前编译对象</text><text x="590" y="617" text-anchor="middle" font-size="21">保存 prior 并立即安装新值；with 退出时 finally 恢复</text><rect x="90" y="705" width="1000" height="190" rx="24" fill="#fff0cf" stroke="#d8a000" stroke-width="3"/><text x="590" y="741" text-anchor="middle" font-size="25">随节点处理更新本图状态（重复）</text><text x="590" y="781" text-anchor="middle" font-size="21">共享：输入登记 / 节点派发建立 IR，并安装当前节点</text><text x="590" y="812" text-anchor="middle" font-size="21">尺寸：静态常数，或沿用 / 创建符号尺寸与步长</text><text x="590" y="843" text-anchor="middle" font-size="21">设备：type 集合 + index 集合；完整 device → 首次来源节点</text><text x="590" y="874" text-anchor="middle" font-size="21">能力：按设备类型查询 BackendFeature，缓存归当前图</text><rect x="90" y="955" width="1000" height="165" rx="24" fill="#f3f3f3" stroke="#888" stroke-width="3"/><text x="590" y="991" text-anchor="middle" font-size="25">交给后续模块：保留 GraphLowering 与已建立的 IR</text><text x="590" y="1031" text-anchor="middle" font-size="21">共享：布局选择、Scheduler、wrapper、编译加载读取同一状态</text><text x="590" y="1062" text-anchor="middle" font-size="21">收集到多个设备类型，不代表 wrapper 允许它们混用</text><text x="590" y="1093" text-anchor="middle" font-size="21">仅登记设备名，不会实现 allocator、算子、guard 或 launcher</text><path d="M590 215 V285" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M590 450 V510" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M590 645 V705" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M590 895 V955" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="590" y="1160" text-anchor="middle" font-size="18">本篇为职责叶子；图中动作不另拆模块。灰框 / 共享项由已有相邻模块负责</text><rect x="90" y="1260" width="1000" height="145" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="590" y="1296" text-anchor="middle" font-size="25">退出本次编译作用域：恢复先前 handler</text><text x="590" y="1336" text-anchor="middle" font-size="21">正常退出、嵌套返回、异常退出都恢复 prior</text><text x="590" y="1367" text-anchor="middle" font-size="21">图对象和 IR 仍由调用者持有；V 不再冒充永久的进程级当前图</text><path d="M590 1195 V1260" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="625" y="1470" text-anchor="middle" font-size="19">实线：编译控制与状态交接。本篇只研究编译状态，未生成或执行设备 kernel</text></g></svg>