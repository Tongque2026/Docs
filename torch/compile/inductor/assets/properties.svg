<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1030" viewBox="0 0 1100 1030"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1030" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="40" text-anchor="middle" font-size="30">属性与布局：从初次传播到改写后更新</text><text x="550" y="95" text-anchor="middle" font-size="23">输入：gm、example_inputs；输出仍保存在节点元数据中</text><rect x="45" y="130" width="1010" height="710" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="110" y="155" width="880" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550" y="189" text-anchor="middle" font-size="23">① 初次属性建立 · 布局兼容</text><text x="550" y="227" text-anchor="middle" font-size="21">view target → reshape；保持原节点身份</text><text x="550" y="259" text-anchor="middle" font-size="21">在属性执行前允许后续合法的布局处理</text><path d="M550 280 V333" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="335" width="880" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="369" text-anchor="middle" font-size="23">① 初次属性建立 · 全图传播</text><text x="550" y="407" text-anchor="middle" font-size="21">复用或新建 FakeTensor mode</text><text x="550" y="439" text-anchor="middle" font-size="21">返回 mode；node.meta[&quot;val&quot;] 保存属性</text><path d="M550 460 V513" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="515" width="880" height="125" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="550" y="549" text-anchor="middle" font-size="23">② 增量属性维护 · 改写前</text><text x="550" y="587" text-anchor="middle" font-size="21">保存节点 target、args、kwargs 的身份</text><text x="550" y="619" text-anchor="middle" font-size="21">图改写继续复用同一张 graph</text><path d="M550 640 V693" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="695" width="880" height="125" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="550" y="729" text-anchor="middle" font-size="23">② 增量属性维护 · 改写后</text><text x="550" y="767" text-anchor="middle" font-size="21">执行变化节点；属性改变时传播到使用者</text><text x="550" y="799" text-anchor="middle" font-size="21">维护符号绑定和共享存储关系</text><text x="550" y="935" text-anchor="middle" font-size="21">交给图重写或收尾：带属性的 gm + 同一 FakeTensor mode</text><text x="550" y="982" text-anchor="middle" font-size="18">实线：编译期间交接；同一编号重复出现表示同一模块再次参与</text></g></svg>