<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="2000" viewBox="0 0 1450 2000"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1450" height="2000" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="725" y="45" text-anchor="middle" font-size="28">调用适配与 CUDA Graph：先安装当前入口，再使用本次输入运行</text><rect x="70" y="90" width="1110" height="115" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="625" y="126" text-anchor="middle" font-size="25">输入：CompiledFxGraph + 示例输入 + 共享 BoxedBool</text><text x="625" y="168" text-anchor="middle" font-size="22">命中恢复 / 新编译 / bypass 汇合；AOT 路径字符串直接返回，不走本层</text><rect x="70" y="260" width="1110" height="160" rx="24" fill="#e1f2ff" stroke="#368dc0" stroke-width="3"/><text x="625" y="296" text-anchor="middle" font-size="25">① 编译后策略与运行状态</text><text x="625" y="338" text-anchor="middle" font-size="22">将 output_strides 回填当前 TracingContext</text><text x="625" y="371" text-anchor="middle" font-size="22">已有禁用原因 / 条件不满足 → 共享 CUDA Graph 开关变 False</text><text x="625" y="404" text-anchor="middle" font-size="22">允许捕获 → 交③安装延迟入口；此时不等于已经捕获</text><rect x="70" y="475" width="1110" height="150" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="625" y="511" text-anchor="middle" font-size="25">③ 捕获、重放与 Graph Trees：安装延迟 callable</text><text x="625" y="553" text-anchor="middle" font-size="22">保存原 callable、static 索引、设备、常量、mutation 等信息</text><text x="625" y="586" text-anchor="middle" font-size="22">返回包装入口；首次真实调用时才触发捕获实现</text><rect x="70" y="695" width="1110" height="160" rx="24" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="625" y="731" text-anchor="middle" font-size="25">② 输入对齐与调用转交：安装普通运行适配</text><text x="625" y="773" text-anchor="middle" font-size="22">CUDA Graph 已禁用：按 inputs_to_check 决定是否包装 callable</text><text x="625" y="806" text-anchor="middle" font-size="22">无检查项 → 原入口；有检查项 → 运行时先检查实际地址</text><text x="625" y="839" text-anchor="middle" font-size="22">允许 CUDA Graph 的路径：对齐由③中的相应入口处理</text><rect x="70" y="925" width="1110" height="125" rx="24" fill="#fff4ce" stroke="#d6a000" stroke-width="3"/><text x="625" y="961" text-anchor="middle" font-size="25">输出：原 CompiledFxGraph，current_callable 已按条件更新</text><text x="625" y="1003" text-anchor="middle" font-size="22">post_compile 返回对象；编译后适配不写回 FX 缓存描述</text><rect x="70" y="1130" width="1110" height="155" rx="24" fill="#fff4ce" stroke="#d6a000" stroke-width="3"/><text x="625" y="1166" text-anchor="middle" font-size="25">之后真实调用：CompiledFxGraph.__call__(inputs_list)</text><text x="625" y="1208" text-anchor="middle" font-size="22">普通路径经②：必要时替换列表中的 Tensor，再转交编译入口</text><text x="625" y="1241" text-anchor="middle" font-size="22">Graph 路径经③：延迟建立 / 查找运行方案，再转交捕获或重放</text><text x="625" y="1274" text-anchor="middle" font-size="22">参数列表可被消费；不能把它与 Tensor 存储修改混为一谈</text><rect x="70" y="1345" width="1110" height="185" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="625" y="1381" text-anchor="middle" font-size="25">③运行阶段：捕获与重放有自己的状态和失败边界</text><text x="625" y="1423" text-anchor="middle" font-size="22">legacy：固定输入/输出存储、复制动态输入、重放</text><text x="625" y="1456" text-anchor="middle" font-size="22">Trees：整型键、执行路径、存储活性、静态地址与 mutation 条件</text><text x="625" y="1489" text-anchor="middle" font-size="22">不适用可选择普通执行；捕获异常不保证自动兜底</text><text x="625" y="1522" text-anchor="middle" font-size="22">GPU 捕获本轮未运行，协议 fixture 与真实 CPU 证据分开</text><rect x="70" y="1600" width="1110" height="130" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="625" y="1636" text-anchor="middle" font-size="25">交付本次结果与状态变化</text><text x="625" y="1678" text-anchor="middle" font-size="22">输出 / alias / mutation 由真实运行入口决定</text><text x="625" y="1711" text-anchor="middle" font-size="22">新设备需明确对齐、固定地址、allocator、stream 和生命周期协议</text><path d="M625 205 V260" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 420 V475" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 855 V925" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 1285 V1345" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 1530 V1600" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 625 V695" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="880" y="665" text-anchor="middle" font-size="18">安装后继续 post_compile</text><path d="M1180 340 H1240 V775 H1180" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="1260" y="510" font-size="18">禁用：</text><text x="1260" y="540" font-size="18">跳过③安装</text><path d="M625 1050 V1070 H110 V1110 H625 V1130" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#a)"/><text x="625" y="1095" text-anchor="middle" font-size="19">后续调用时点</text><path d="M1180 1210 H1240 V1665 H1180" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="1260" y="1400" font-size="18">普通入口：</text><text x="1260" y="1430" font-size="18">跳过③运行</text><text x="780" y="1320" text-anchor="middle" font-size="18">Graph 路径</text><text x="725" y="1840" text-anchor="middle" font-size="20">①②③是三个直接职责；普通非 Graph 执行不需要经过③的捕获/重放运行阶段。</text><text x="725" y="1890" text-anchor="middle" font-size="19">实线表示当前阶段的交接，虚线表示返回之后的调用时点；具体分支条件写在节点中。</text></g></svg>