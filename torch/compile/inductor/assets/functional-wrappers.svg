<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1360" viewBox="0 0 1300 1360"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1300" height="1360" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="650" y="43" text-anchor="middle" font-size="29">功能化包装分解：把保留 clone 的决策变成实际图操作</text><text x="650" y="94" text-anchor="middle" font-size="20">前提：原地化核心已经给出完整 clone 决策；缺省空名单不等于未知时全部 clone</text><rect x="30" y="120" width="1240" height="1120" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="200" y="155" width="900" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="650.0" y="190" text-anchor="middle" font-size="23">建立本次 PatternMatcherPass，登记三类 Graph handler</text><text x="650.0" y="233" text-anchor="middle" font-size="20">CallFunctionVarArgs 捕获各自完整位置参数与关键字参数</text><text x="650.0" y="263" text-anchor="middle" font-size="20">登记完毕再 apply；此刻尚未运行下面的 decomp 闭包</text><rect x="55" y="410" width="370" height="190" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="240.0" y="445" text-anchor="middle" font-size="23">auto_functionalized v1</text><text x="240.0" y="488" text-anchor="middle" font-size="17">从 node.meta 取保留参数名</text><text x="240.0" y="518" text-anchor="middle" font-size="17">转换为 tuple，交 dense 实现</text><text x="240.0" y="548" text-anchor="middle" font-size="17">只 clone 名单中的 mutable 参数</text><text x="240.0" y="578" text-anchor="middle" font-size="17">输出：原返回项 + mutable 参数结果</text><rect x="465" y="410" width="370" height="190" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="650.0" y="445" text-anchor="middle" font-size="23">auto_functionalized v2</text><text x="650.0" y="488" text-anchor="middle" font-size="17">同字段保存的是 base 整数索引</text><text x="650.0" y="518" text-anchor="middle" font-size="17">交给 v2 dense，先选 base clone</text><text x="650.0" y="548" text-anchor="middle" font-size="17">再按原视图信息重建 mutable 参数</text><text x="650.0" y="578" text-anchor="middle" font-size="17">输出：原返回项 + 完整 base 结果</text><rect x="875" y="410" width="370" height="190" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="1060.0" y="445" text-anchor="middle" font-size="23">Triton functional wrapper</text><text x="1060.0" y="488" text-anchor="middle" font-size="17">名单来自 kwargs.tensors_to_clone</text><text x="1060.0" y="518" text-anchor="middle" font-size="17">交 functional dense 实现</text><text x="1060.0" y="548" text-anchor="middle" font-size="17">字典结果外面再包装一层 tuple</text><text x="1060.0" y="578" text-anchor="middle" font-size="17">替代图可包含 mutation wrapper</text><rect x="200" y="710" width="900" height="155" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="650.0" y="745" text-anchor="middle" font-size="23">各 handler：flatten 参数 → 建立 decomp → replace_by_example</text><text x="650.0" y="788" text-anchor="middle" font-size="20">spec 保存 args/kwargs 结构；decomp 用 unflatten 恢复，再调用对应 dense</text><text x="650.0" y="818" text-anchor="middle" font-size="20">按当前 FakeTensor 输入追踪替代图，复制节点并重接原 getitem 等使用者</text><text x="650.0" y="848" text-anchor="middle" font-size="20">run_functional_passes=False：跳过替代图中的 noop / DCE 功能式假设</text><rect x="200" y="970" width="900" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="650.0" y="1005" text-anchor="middle" font-size="23">apply 返回后：逐类检查原 functional target 是否仍存在</text><text x="650.0" y="1048" text-anchor="middle" font-size="20">任何一类残留 → 对应 AssertionError</text><text x="650.0" y="1078" text-anchor="middle" font-size="20">成功：三类目标都清空，正常返回 None；继续 post-grad 收尾</text><path d="M650 280 V340 H240 V410" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M650 340 V410" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M650 340 H1060 V410" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M240 600 V645 H410 V710" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M650 600 V710" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M1060 600 V645 H890 V710" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M650 865 V970" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><text x="650" y="1170" text-anchor="middle" font-size="21">输出仍是 FX 图：clone、布局恢复和底层 mutable 操作已经显式出现</text><text x="650" y="1290" text-anchor="middle" font-size="19">实线：匹配命中后的编译期图转换；多个 wrapper 按 matcher 的候选扫描逐个处理</text><text x="650" y="1330" text-anchor="middle" font-size="19">三类 functional target 被移除，不代表图中所有高阶 / 自定义算子都必须消失</text></g></svg>