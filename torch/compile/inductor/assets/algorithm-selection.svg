<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1960" viewBox="0 0 1400 1960"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1400" height="1960" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="700" y="44" text-anchor="middle" font-size="29">模板候选与方案选择：生成描述、按需比较、交回实现 IR</text><rect x="90" y="90" width="1120" height="110" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="650" y="126" text-anchor="middle" font-size="25">输入：算子名、输入 IR、输出 layout 与候选条件</text><text x="650" y="166" text-anchor="middle" font-size="21">共享的专用 lowering 决定加入哪些实现；本层不重新介绍上游编译流程</text><rect x="90" y="250" width="1120" height="140" rx="24" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="650" y="286" text-anchor="middle" font-size="25">① 候选对象与模板生成</text><text x="650" y="326" text-anchor="middle" font-size="21">Caller 保留实现 hash、输入/layout、编译或可调用描述、output_node</text><text x="650" y="357" text-anchor="middle" font-size="21">模板还携带渲染与 BenchmarkRequest；不是只有一个候选名字</text><rect x="90" y="440" width="1120" height="145" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="650" y="476" text-anchor="middle" font-size="25">③ 计时缓存与结果交付：先过滤与分流</text><text x="650" y="516" text-anchor="middle" font-size="21">过滤 None；空集 → 拒绝；单个非 CUDA 模板 → output_node 后结束</text><text x="650" y="547" text-anchor="middle" font-size="21">多候选或 CUDATemplateCaller 例外，才继续下方路径</text><rect x="90" y="645" width="1120" height="155" rx="24" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="650" y="681" text-anchor="middle" font-size="25">② 预编译、校验与计时：准备编译任务</text><text x="650" y="721" text-anchor="middle" font-size="21">可先查询③是否已有完整计时，命中可省略预编译</text><text x="650" y="752" text-anchor="middle" font-size="21">按条件提交 Future，保留等待函数；这还不是模型执行</text><text x="650" y="783" text-anchor="middle" font-size="21">延迟选择对象返回前，也可能已提交预编译</text><rect x="90" y="860" width="1120" height="165" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="650" y="896" text-anchor="middle" font-size="25">③ 计时缓存与结果交付：确定消费时点</text><text x="650" y="936" text-anchor="middle" font-size="21">立即路径现在需要计时；延迟路径先返回 MultiTemplateBuffer</text><text x="650" y="967" text-anchor="middle" font-size="21">延迟对象首次读取 choice_timings 时，才触发下面的查表/测时</text><text x="650" y="998" text-anchor="middle" font-size="21">CPU 或提供 input_gen_fns 时禁用该延迟路径</text><rect x="90" y="1085" width="1120" height="130" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="650" y="1121" text-anchor="middle" font-size="25">③ 先调用②等待函数，再查询候选计时</text><text x="650" y="1161" text-anchor="middle" font-size="21">键含实现 hash、输入布局、精度与系统描述</text><text x="650" y="1192" text-anchor="middle" font-size="21">命中 → 右侧交付；缺失且允许测试 → 交给②</text><rect x="90" y="1275" width="1120" height="160" rx="24" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="650" y="1311" text-anchor="middle" font-size="25">② 预编译、校验与计时：实际执行候选测试</text><text x="650" y="1351" text-anchor="middle" font-size="21">生成实际输入，正确解释布局、基地址与 offset</text><text x="650" y="1382" text-anchor="middle" font-size="21">VERIFY 开启时做相应校验；实际计时可产生失败/inf</text><text x="650" y="1413" text-anchor="middle" font-size="21">把测得映射交回③更新缓存；不是人工 score 充当耗时</text><rect x="90" y="1495" width="1120" height="155" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="650" y="1531" text-anchor="middle" font-size="25">③ 选择并交付 output_node，或保存延迟结果</text><text x="650" y="1571" text-anchor="middle" font-size="21">正常完整计时取最小；空表/首候选缺失有退路；全非有限结果拒绝</text><text x="650" y="1602" text-anchor="middle" font-size="21">得到外部调用 / 模板 buffer 等 IR，延迟对象可供调度继续确定</text><text x="650" y="1633" text-anchor="middle" font-size="21">计时缓存复用不固定模型答案，也不缓存返回 Tensor</text><path d="M650 200 V250" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M650 390 V440" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M650 585 V645" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="676" y="621.0" font-size="18">其余候选</text><path d="M650 800 V860" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M650 1025 V1085" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="676" y="1061.0" font-size="18">需要结果时</text><path d="M650 1215 V1275" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="676" y="1251.0" font-size="18">缺失且允许测试</text><path d="M650 1435 V1495" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="676" y="1471.0" font-size="18">实际结果</text><path d="M1210 1150 H1260 V1570 H1210" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="1280" y="1330" font-size="18">命中：</text><text x="1280" y="1360" font-size="18">跳过测时</text><rect x="90" y="1720" width="1120" height="120" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="650" y="1756" text-anchor="middle" font-size="25">共享：调度 / 设备 codegen / 编译加载</text><text x="650" y="1796" text-anchor="middle" font-size="21">接收选择后的 IR，再形成正式可执行图入口；GPU 等路径仍需对应设备实现</text><path d="M650 1650 V1720" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="700" y="1900" text-anchor="middle" font-size="19">实线：控制和结果交接；延迟时点在框中注明。①②③是三个职责，不是固定只执行一次的阶段</text></g></svg>