<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1910" viewBox="0 0 1450 1910"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1450" height="1910" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="725" y="45" text-anchor="middle" font-size="28">调度实例与后端委托：注册表按类型，实例缓存按完整设备</text><rect x="70" y="90" width="1110" height="115" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="625" y="126" text-anchor="middle" font-size="25">输入：torch.device + 当前 Scheduler，已登记 Scheduling 工厂</text><text x="625" y="168" text-anchor="middle" font-size="22">调用前可由 Lowering 的 decode_device 补编号；get_backend 不自行归一化</text><rect x="70" y="260" width="1110" height="135" rx="24" fill="#e1f2ff" stroke="#368dc0" stroke-width="3"/><text x="625" y="296" text-anchor="middle" font-size="25">get_backend：查 self.backends[device]</text><text x="625" y="338" text-anchor="middle" font-size="22">cuda:0 / cuda:1 是不同 key；同一 Scheduler 内复用</text><text x="625" y="371" text-anchor="middle" font-size="22">命中直接返回；未命中进入 create_backend</text><rect x="70" y="455" width="1110" height="180" rx="24" fill="#e1f2ff" stroke="#368dc0" stroke-width="3"/><text x="625" y="491" text-anchor="middle" font-size="25">create_backend：检查与类型选择</text><text x="625" y="533" text-anchor="middle" font-size="22">cuda/xpu 编号缺失 → 断言失败；随后才登记图设备信息</text><text x="625" y="566" text-anchor="middle" font-size="22">按 device.type 查注册表；缺失 → Unsupported device type</text><text x="625" y="599" text-anchor="middle" font-size="22">Triton 不可用时检查 CUDA 属性 / GPU 分类；条件不符即失败</text><rect x="70" y="695" width="1110" height="140" rx="24" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="625" y="731" text-anchor="middle" font-size="25">device_scheduling(self)：构造当前图的 Scheduling</text><text x="625" y="773" text-anchor="middle" font-size="22">self 是真实 Scheduler；不是能力查询中的 None 探测</text><text x="625" y="806" text-anchor="middle" font-size="22">组合后端会建立三个子 delegate，保留同一个 Scheduler</text><rect x="70" y="895" width="1110" height="140" rx="24" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="625" y="931" text-anchor="middle" font-size="25">构造成功才写入 self.backends[device]</text><text x="625" y="973" text-anchor="middle" font-size="22">失败没有缓存实例，但此前图设备信息不会自动回滚</text><text x="625" y="1006" text-anchor="middle" font-size="22">修改全局注册表不替换已经缓存的当前图实例</text><rect x="70" y="1095" width="1110" height="125" rx="24" fill="#fff4ce" stroke="#d6a000" stroke-width="3"/><text x="625" y="1131" text-anchor="middle" font-size="25">返回：当前设备对应的同一 Scheduling 对象</text><text x="625" y="1173" text-anchor="middle" font-size="22">供分组、融合、生成与 flush 等阶段重复使用</text><rect x="70" y="1290" width="1110" height="205" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="625" y="1326" text-anchor="middle" font-size="25">BaseScheduling / CUDACombinedScheduling：按具体方法处理</text><text x="625" y="1368" text-anchor="middle" font-size="22">基类：九项未实现接口；空能力 / ready=False / priority=0 有默认值</text><text x="625" y="1401" text-anchor="middle" font-size="22">组合：普通节点、能力、分组、同步、flush 等直接委托 Triton</text><text x="625" y="1434" text-anchor="middle" font-size="22">模板生成：CUDA C++ → ROCm C++ → Triton；前两者拒绝非空 epilogue</text><text x="625" y="1467" text-anchor="middle" font-size="22">融合方法各有自己的分支，不统一经过 choose_node_backend</text><rect x="70" y="1570" width="1110" height="140" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="625" y="1606" text-anchor="middle" font-size="25">交出结果与生成状态：kernel / wrapper 消费后端方法</text><text x="625" y="1648" text-anchor="middle" font-size="22">具体循环、模板渲染、合并节点与运行时由其各自模块实现</text><text x="625" y="1681" text-anchor="middle" font-size="22">本层创建编译器对象与组织委托，不在这里执行模型 Tensor 计算</text><path d="M625 205 V260" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 395 V455" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 635 V695" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 835 V895" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 1035 V1095" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 1220 V1290" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 1495 V1570" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M1180 325 H1240 V1158 H1180" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="1260" y="715" font-size="18">实例命中：</text><text x="1260" y="747" font-size="18">跳过创建</text><text x="725" y="1790" text-anchor="middle" font-size="19">BaseScheduling 可零参数构造，但不提供接收 Scheduler 的构造器；新设备还需满足实例构造契约。</text><text x="725" y="1840" text-anchor="middle" font-size="19">真实 CPU 编译验证实例复用；GPU 属性、设备 worker 与子 delegate 的协议 fixture 明确区分。</text></g></svg>