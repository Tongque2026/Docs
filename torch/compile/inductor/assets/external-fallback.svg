<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1950" viewBox="0 0 1300 1950"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1300" height="1950" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="650" y="44" text-anchor="middle" font-size="29">外部调用与 fallback 协议：描述一次调用，保留结构与副作用</text><rect x="35" y="85" width="1230" height="1470" rx="34" fill="#fff9da" stroke="#d7a000" stroke-width="3"/><text x="650" y="125" text-anchor="middle" font-size="22">编译阶段：接收 target、IR 参数、kwargs 和当前图状态</text><rect x="110" y="155" width="1080" height="160" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="650" y="191" text-anchor="middle" font-size="25">① 注册、派发与布局约束</text><text x="650" y="231" text-anchor="middle" font-size="21">显式登记 / 未知 target 策略 / 节点级 fallback；不能给任意 Python 函数登记</text><text x="650" y="262" text-anchor="middle" font-size="21">要求实现输入；布局约束可能复制成连续存储</text><text x="650" y="293" text-anchor="middle" font-size="21">未知且不允许、decomposition 冲突等条件 → 编译拒绝</text><rect x="110" y="375" width="1080" height="165" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="650" y="411" text-anchor="middle" font-size="25">② 参数物化与输出描述：准备调用并重推导属性</text><text x="650" y="451" text-anchor="middle" font-size="21">展平 args / kwargs，分离 IR 与非 Tensor 参数，保存 unflatten 规则</text><text x="650" y="482" text-anchor="middle" font-size="21">realize 输入、冻结布局，按当前 stride 重建通常的 Fake 调用</text><text x="650" y="513" text-anchor="middle" font-size="21">取得输出结构 / dtype / device / stride / 符号描述，不是模型答案</text><rect x="110" y="600" width="1080" height="165" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="650" y="636" text-anchor="middle" font-size="25">③ 调用生成与副作用：构造 packed 节点时核对 schema</text><text x="650" y="676" text-anchor="middle" font-size="21">functional / view / 受支持 mutable 分支分别处理</text><text x="650" y="707" text-anchor="middle" font-size="21">登记 alias_names、MutationOutput、side effects 等依赖要求</text><text x="650" y="738" text-anchor="middle" font-size="21">复制后写入还需共享 mutation 传播写回原输入；不支持的 schema 拒绝</text><rect x="110" y="825" width="1080" height="165" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="650" y="861" text-anchor="middle" font-size="25">② 参数物化与输出描述：交回输出 IR</text><text x="650" y="901" text-anchor="middle" font-size="21">一个 packed FallbackKernel 可对应多个 MultiOutput</text><text x="650" y="932" text-anchor="middle" font-size="21">tuple / list / dict 路径取同一次结果；NoneLayout 表示没有普通返回值</text><text x="650" y="963" text-anchor="middle" font-size="21">不支持的输出、设备推断或符号绑定条件仍可失败</text><rect x="110" y="1050" width="1080" height="125" rx="23" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="650" y="1086" text-anchor="middle" font-size="25">共享：依赖、调度与存储维护</text><text x="650" y="1126" text-anchor="middle" font-size="21">外部调用前后可以有普通生成 kernel；按读写 / 别名约束安排顺序</text><text x="650" y="1157" text-anchor="middle" font-size="21">没有 Tensor 返回值的写入仍需保留，不能作为无用计算删除</text><rect x="110" y="1235" width="1080" height="190" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="650" y="1271" text-anchor="middle" font-size="25">③ 调用生成与副作用：wrapper 生成调用文本</text><text x="650" y="1311" text-anchor="middle" font-size="21">unflatten 还原参数；Python 发 torch.ops 调用和结果取项</text><text x="650" y="1342" text-anchor="middle" font-size="21">NoneLayout：发调用、不接普通结果；多个取项不重复执行算子</text><text x="650" y="1373" text-anchor="middle" font-size="21">C++ / AOT 另有 C shim、runtime dispatch、序列化及 ABI 要求</text><text x="650" y="1404" text-anchor="middle" font-size="21">完成源码后交给编译加载，等待调用者传入真实输入</text><path d="M650 315 V375" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M650 540 V600" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M650 765 V825" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M650 990 V1050" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M650 1175 V1235" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="650" y="1495" text-anchor="middle" font-size="19">三个职责交替参与：① 注册、派发与布局约束　② 参数物化与输出描述　③ 调用生成与副作用</text><rect x="110" y="1640" width="1080" height="165" rx="23" fill="#fff0df" stroke="#dc8d35" stroke-width="3"/><text x="650" y="1676" text-anchor="middle" font-size="25">运行阶段：dispatcher 调用目标设备已有实现</text><text x="650" y="1716" text-anchor="middle" font-size="21">前置 kernel 物化输入 → 一次外部调用 → 取项 / 后续 kernel / 必要写回</text><text x="650" y="1747" text-anchor="middle" font-size="21">Fake 描述成功不等于设备已有数值 kernel，也不自动搬到 CPU</text><text x="650" y="1778" text-anchor="middle" font-size="21">本篇 CPU 五组各运行两次；GPU 只验证 Fake 输出与注册表</text><path d="M650 1555 V1640" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="677" y="1603.5" font-size="18">加载后由调用者触发</text><text x="650" y="1880" text-anchor="middle" font-size="20">实线：编译控制 / 数据交接，跨阶段箭头注明触发。灰框为共享职责</text></g></svg>