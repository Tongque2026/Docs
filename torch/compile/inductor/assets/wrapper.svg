<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="850" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="40" text-anchor="middle" font-size="30">Wrapper：把图接口、存储和调用组为入口</text><text x="550" y="95" text-anchor="middle" font-size="23">输入：图参数、kernel 参数要求、布局与生命周期请求</text><rect x="45" y="130" width="1010" height="530" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="110" y="155" width="880" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550" y="189" text-anchor="middle" font-size="23">① 入口与设备调用</text><text x="550" y="227" text-anchor="middle" font-size="21">取得参数与动态尺寸；建立检查和设备上下文</text><text x="550" y="259" text-anchor="middle" font-size="21">积累普通 kernel / 外部调用的顺序</text><path d="M550 280 V333" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="335" width="880" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="369" text-anchor="middle" font-size="23">② 存储计划与复用</text><text x="550" y="407" text-anchor="middle" font-size="21">把分配 / 释放请求规划为实际存储操作</text><text x="550" y="439" text-anchor="middle" font-size="21">复用可用内部缓冲区；保留输入与别名限制</text><path d="M550 460 V513" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="515" width="880" height="125" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="550" y="549" text-anchor="middle" font-size="23">③ 输出、别名与子图</text><text x="550" y="587" text-anchor="middle" font-size="21">连接返回引用；保留视图和修改语义</text><text x="550" y="619" text-anchor="middle" font-size="21">生成 if / while 的父子图参数与结果交接</text><text x="550" y="755" text-anchor="middle" font-size="21">输出：完整 wrapper 源码及行映射，之后交编译与加载</text><text x="550" y="802" text-anchor="middle" font-size="18">实线：编译期间交接；同一编号重复出现表示同一模块再次参与</text></g></svg>