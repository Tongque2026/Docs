<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1170" viewBox="0 0 1100 1170"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1170" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="42" text-anchor="middle" font-size="29">增量属性维护：结构、属性与使用者分别判断</text><text x="550" y="95" text-anchor="middle" font-size="21">构造基线 → 外部改图 → 调用 incremental_update</text><rect x="35" y="130" width="1040" height="920" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="130" y="155" width="670" height="110" rx="22" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="465" y="189" text-anchor="middle" font-size="23">构造：保存 graph 与 processed_hashes</text><text x="465" y="225" text-anchor="middle" font-size="19">签名是 node、target、args/kwargs 容器身份</text><rect x="130" y="320" width="670" height="110" rx="22" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="465" y="354" text-anchor="middle" font-size="23">本轮初始化</text><text x="465" y="390" text-anchor="middle" font-size="19">统计 existing_storages；创建 to_process</text><rect x="130" y="485" width="670" height="110" rx="22" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="465" y="519" text-anchor="middle" font-size="23">逐节点筛选</text><text x="465" y="555" text-anchor="middle" font-size="19">旧签名且未标记、target 不可 fake、缺参数属性 → 右侧</text><text x="465" y="584" text-anchor="middle" font-size="19">否则在当前 FakeTensor mode 处理</text><rect x="130" y="650" width="670" height="110" rx="22" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="465" y="684" text-anchor="middle" font-size="23">Fake 执行并比较</text><text x="465" y="720" text-anchor="middle" font-size="19">被判相同 → 保留旧 metadata，直接走右侧</text><text x="465" y="749" text-anchor="middle" font-size="19">新签名在这个 continue 分支不会额外登记</text><rect x="130" y="815" width="670" height="140" rx="22" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="465" y="849" text-anchor="middle" font-size="23">属性需要更新</text><text x="465" y="885" text-anchor="middle" font-size="19">绑定符号、写 val、更新存储计数</text><text x="465" y="914" text-anchor="middle" font-size="19">标记使用者，保存当前签名；然后走右侧</text><path d="M465 265 V320" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><path d="M465 430 V485" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><path d="M465 595 V650" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><path d="M465 760 V815" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><rect x="850" y="365" width="200" height="590" rx="22" fill="#fafafa" stroke="#777" stroke-width="2.5"/><text x="950" y="403" text-anchor="middle" font-size="21">扫描控制</text><text x="950" y="450" text-anchor="middle" font-size="17">跳过或更新完成</text><text x="950" y="484" text-anchor="middle" font-size="17">均继续下一个节点</text><text x="950" y="518" text-anchor="middle" font-size="17">上游标记的用户</text><text x="950" y="552" text-anchor="middle" font-size="17">签名未变也会处理</text><text x="950" y="890" text-anchor="middle" font-size="16">扫描结束：返回 None</text><path d="M950 365 V340 H825 V460 H465" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)" stroke-dasharray="7 5"/><path d="M800 540 H850" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><path d="M800 705 H850" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><path d="M800 885 H850" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><text x="550" y="1087" text-anchor="middle" font-size="19">主要结果写入 node.meta；存储计数和已处理签名是不同状态</text><text x="550" y="1128" text-anchor="middle" font-size="17">实线：本轮处理；虚线：继续扫描。扫描结束后退出，跳过条件写在框内</text></g></svg>