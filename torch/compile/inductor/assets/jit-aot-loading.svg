<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1740" viewBox="0 0 1400 1740"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1400" height="1740" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="700" y="45" text-anchor="middle" font-size="28">JIT 与 AOT 装载：当前进程入口、磁盘产物、运行容器各是什么</text><rect x="140" y="90" width="1120" height="120" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="700.0" y="126" text-anchor="middle" font-size="24">输入：GraphLowering 的生成程序与常量状态</text><text x="700.0" y="170" text-anchor="middle" font-size="21">compile_to_fn 根据 aot_mode 选择出口</text><path d="M700 210 V245 H355 V290" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M700 245 H1045 V290" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="200" y="273" text-anchor="middle" font-size="20">JIT</text><text x="880" y="273" text-anchor="middle" font-size="20">AOT（要求 C++ wrapper）</text><rect x="60" y="290" width="590" height="250" rx="24" fill="#e1f2ff" stroke="#368dc0" stroke-width="3"/><text x="355.0" y="326" text-anchor="middle" font-size="24">① JIT 模块与入口</text><text x="355.0" y="370" text-anchor="middle" font-size="21">生成 wrapper 源码 → 写 Python 文件</text><text x="355.0" y="404" text-anchor="middle" font-size="21">PyCodeCache：执行模块顶层 / 查询模块缓存</text><text x="355.0" y="438" text-anchor="middle" font-size="21">顶层可包含 kernel 编译与 wait</text><text x="355.0" y="472" text-anchor="middle" font-size="21">冷加载执行后安装常量 attrs、保存行映射</text><text x="355.0" y="506" text-anchor="middle" font-size="21">Graph 保存 key / path / linemap</text><rect x="750" y="290" width="590" height="250" rx="24" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="1045.0" y="326" text-anchor="middle" font-size="24">② AOT 产物构建</text><text x="1045.0" y="370" text-anchor="middle" font-size="21">生成 C++ wrapper 源码</text><text x="1045.0" y="404" text-anchor="middle" font-size="21">编译 wrapper 与常量产物、链接</text><text x="1045.0" y="438" text-anchor="middle" font-size="21">可另带设备二进制 / 外部节点描述</text><text x="1045.0" y="472" text-anchor="middle" font-size="21">普通分支得到 .so；package 分支归档</text><text x="1045.0" y="506" text-anchor="middle" font-size="21">编译出口尚未建立调用者的 runner</text><path d="M355 540 V600" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M1045 540 V600" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="600" width="590" height="140" rx="24" fill="#fff5ce" stroke="#d6a000" stroke-width="3"/><text x="355.0" y="636" text-anchor="middle" font-size="24">JIT 编译出口：module.call</text><text x="355.0" y="680" text-anchor="middle" font-size="21">当前 Python 进程可调用对象</text><text x="355.0" y="714" text-anchor="middle" font-size="21">交给 CompiledFxGraph 等调用封装</text><rect x="750" y="600" width="590" height="140" rx="24" fill="#fff5ce" stroke="#d6a000" stroke-width="3"/><text x="1045.0" y="636" text-anchor="middle" font-size="24">AOT 编译出口：产物路径字符串</text><text x="1045.0" y="680" text-anchor="middle" font-size="21">尚未执行模型</text><text x="1045.0" y="714" text-anchor="middle" font-size="21">归档需先还原 / 构建 .so，再按运行协议装载</text><path d="M1045 740 V765 H1310 V810 H1045 V835" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#a)"/><text x="1045" y="795" text-anchor="middle" font-size="19">后续由调用者另外发起装载</text><rect x="750" y="835" width="590" height="245" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="1045.0" y="871" text-anchor="middle" font-size="24">③ AOT 容器装载与运行</text><text x="1045.0" y="915" text-anchor="middle" font-size="21">动态库查找 AOTInductorModelContainer* 符号</text><text x="1045.0" y="949" text-anchor="middle" font-size="21">CreateWithDevice → 建立模型容器</text><text x="1045.0" y="983" text-anchor="middle" font-size="21">runner 收到 Tensor 列表 → 转换句柄</text><text x="1045.0" y="1017" text-anchor="middle" font-size="21">Run 传入 stream / proxy executor</text><text x="1045.0" y="1051" text-anchor="middle" font-size="21">取回输出句柄，转成 Tensor</text><path d="M355 740 V810 H110 V1100 H355 V1150" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#a)"/><text x="355" y="945" text-anchor="middle" font-size="21">后续模型调用</text><text x="355" y="982" text-anchor="middle" font-size="19">不是模块 import 时执行 Tensor 计算</text><rect x="60" y="1150" width="590" height="160" rx="24" fill="#e1f2ff" stroke="#368dc0" stroke-width="3"/><text x="355.0" y="1186" text-anchor="middle" font-size="24">运行 JIT 入口</text><text x="355.0" y="1230" text-anchor="middle" font-size="21">call(args) 读取常量、分配输出、启动 kernel</text><text x="355.0" y="1264" text-anchor="middle" font-size="21">具体模型输入在这个时点交入</text><text x="355.0" y="1298" text-anchor="middle" font-size="21">得到本次输出 Tensor</text><path d="M1045 1080 V1150" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><rect x="750" y="1150" width="590" height="160" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="1045.0" y="1186" text-anchor="middle" font-size="24">运行 AOT 入口</text><text x="1045.0" y="1230" text-anchor="middle" font-size="21">低层 runner.run(flat_tensors)</text><text x="1045.0" y="1264" text-anchor="middle" font-size="21">高层适配还根据 call_spec 展平 / 重建结构</text><text x="1045.0" y="1298" text-anchor="middle" font-size="21">得到本次输出 Tensor</text><rect x="140" y="1400" width="1120" height="135" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="700.0" y="1436" text-anchor="middle" font-size="24">共享：源码 / 二进制缓存、任务等待、设备 wrapper 与 runtime</text><text x="700.0" y="1480" text-anchor="middle" font-size="21">本图按装载出口区分时点；共享机制仍由各自模块解释</text><text x="700.0" y="1514" text-anchor="middle" font-size="21">虚线标记后续调用时点，不代表编译出口已经执行模型</text><text x="700" y="1640" text-anchor="middle" font-size="19">三个直接子模块为①②③；新设备需同时满足编译产物、容器 ABI、设备解析和 stream/句柄协议。</text></g></svg>