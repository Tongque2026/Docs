<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1210" viewBox="0 0 1100 1210"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1210" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="40" text-anchor="middle" font-size="30">图收尾：排序、设备、属性与入口一致性</text><text x="550" y="95" text-anchor="middle" font-size="23">输入：图重写后的 graph 和原 GraphModule</text><rect x="45" y="130" width="1010" height="890" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="110" y="155" width="880" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550" y="189" text-anchor="middle" font-size="23">① 顺序与入口一致性 · 排序</text><text x="550" y="227" text-anchor="middle" font-size="21">pending / ready / waiting 保证生产者先就绪</text><text x="550" y="259" text-anchor="middle" font-size="21">发现数据环或未处理节点则断言失败</text><path d="M550 280 V333" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="335" width="880" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="369" text-anchor="middle" font-size="23">② 构造节点设备迁移</text><text x="550" y="407" text-anchor="middle" font-size="21">检查唯一目标设备与完整使用链</text><text x="550" y="439" text-anchor="middle" font-size="21">只修改允许迁移的 CPU constructor device</text><path d="M550 460 V513" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="515" width="880" height="125" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="550" y="549" text-anchor="middle" font-size="23">共享协作：属性与布局描述</text><text x="550" y="587" text-anchor="middle" font-size="21">调用原 FakeTensorUpdater 补回变化属性</text><text x="550" y="619" text-anchor="middle" font-size="21">本模块不复制属性维护实现</text><path d="M550 640 V693" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="695" width="880" height="125" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="550" y="729" text-anchor="middle" font-size="23">相邻协作：写入语义恢复</text><text x="550" y="767" text-anchor="middle" font-size="21">reinplace、包装分解与通信写入处理</text><text x="550" y="799" text-anchor="middle" font-size="21">图返回后再生成最终 Python 入口</text><path d="M550 820 V873" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="875" width="880" height="125" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="550" y="909" text-anchor="middle" font-size="23">① 顺序与入口一致性 · 入口和校验</text><text x="550" y="947" text-anchor="middle" font-size="21">gm.recompile 对齐 graph 与 forward</text><text x="550" y="979" text-anchor="middle" font-size="21">graph.lint 检查结构；不是数值证明</text><text x="550" y="1115" text-anchor="middle" font-size="21">输出：可交给 GraphLowering 的 gm 和一致属性状态</text><text x="550" y="1162" text-anchor="middle" font-size="18">实线：编译期间交接；同一编号重复出现表示同一模块再次参与</text></g></svg>