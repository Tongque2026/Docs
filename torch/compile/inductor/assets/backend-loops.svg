<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1640" viewBox="0 0 1300 1640"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1300" height="1640" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="650" y="43" text-anchor="middle" font-size="30">后端与循环组织：设备类型怎样选到代码生成实现</text><text x="650" y="94" text-anchor="middle" font-size="20">三个职责：① 后端注册与能力查询　② 调度实例与后端委托　③ 循环展开与 kernel 分组</text><rect x="35" y="120" width="1230" height="1360" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="100" y="155" width="1100" height="155" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="650" y="190" text-anchor="middle" font-size="24">① 后端注册与能力查询</text><text x="650" y="233" text-anchor="middle" font-size="20">设备类型 → Scheduling、Python wrapper、C++ wrapper 三项关联</text><text x="650" y="264" text-anchor="middle" font-size="20">DeviceOpOverrides 独立登记设备操作；不是重命名设备就自动生成</text><text x="650" y="295" text-anchor="middle" font-size="20">能力查询会创建 Scheduling(None)，它不是某张图的运行后端</text><rect x="100" y="375" width="1100" height="125" rx="23" fill="#f4f4f4" stroke="#888" stroke-width="3"/><text x="650" y="410" text-anchor="middle" font-size="24">跨模块：GraphLowering 先建立 wrapper</text><text x="650" y="453" text-anchor="middle" font-size="20">按当前图设备类型查询①，选择 wrapper 类与设备操作对象</text><text x="650" y="484" text-anchor="middle" font-size="20">后续 kernel 定义和调用写入同一个 wrapper；详见 wrapper 子篇</text><rect x="100" y="565" width="1100" height="190" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="650" y="600" text-anchor="middle" font-size="24">② 调度实例与后端委托</text><text x="650" y="643" text-anchor="middle" font-size="19">Scheduler 按完整 device 缓存实例，再从①取 Scheduling 类并构造</text><text x="650" y="674" text-anchor="middle" font-size="19">能力、融合、group_fn 与 codegen_node/template 由该实例提供</text><text x="650" y="705" text-anchor="middle" font-size="19">一个设备类型可委托多个实现：CUDACombinedScheduling 选择模板或普通路径</text><text x="650" y="736" text-anchor="middle" font-size="19">找不到注册类会报错；当前 GPU / Triton 条件另受已有分类函数约束</text><rect x="100" y="820" width="1100" height="155" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="650" y="855" text-anchor="middle" font-size="24">③ 循环展开与 kernel 分组：准备生成环境</text><text x="650" y="898" text-anchor="middle" font-size="20">C++：节点范围 → CppKernelProxy、循环 / 向量化 / 尾部</text><text x="650" y="929" text-anchor="middle" font-size="20">Triton：迭代 / 归约范围 → 节点计划、分块与 mask 环境</text><text x="650" y="960" text-anchor="middle" font-size="20">输入是调度节点及其 IR body；不是一份待执行的真实 Tensor</text><rect x="100" y="1040" width="1100" height="125" rx="23" fill="#f4f4f4" stroke="#888" stroke-width="3"/><text x="650" y="1075" text-anchor="middle" font-size="24">跨模块：元素表达式与目标代码</text><text x="650" y="1118" text-anchor="middle" font-size="20">在当前 kernel 环境解释 load / add / store 等元素表达式</text><text x="650" y="1149" text-anchor="middle" font-size="20">返回生成区文本、临时值与参数使用；完整实现归兄弟模块</text><rect x="100" y="1230" width="1100" height="155" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="650" y="1265" text-anchor="middle" font-size="24">③ 汇总定义与调用，交回已建立的 wrapper</text><text x="650" y="1308" text-anchor="middle" font-size="20">C++ KernelGroup 可积累循环，flush 时生成函数；空组不发调用</text><text x="650" y="1339" text-anchor="middle" font-size="20">后端定义 kernel，并登记参数、编译请求和调用语句</text><text x="650" y="1370" text-anchor="middle" font-size="20">后续 wrapper.generate、编译加载才形成可运行的图入口</text><path d="M650 310 V375" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M650 500 V565" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M650 755 V820" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M650 975 V1040" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M650 1165 V1230" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><text x="650" y="1435" text-anchor="middle" font-size="21">最终交付：kernel 源码 + 参数 / 调用要求；运行时才用真实输入产生结果</text><text x="650" y="1530" text-anchor="middle" font-size="19">实线：一张图的代码生成控制主线；①被后续步骤按需查询，不会每次重新注册</text><text x="650" y="1580" text-anchor="middle" font-size="19">灰框为共享模块。注册与接口实验不等于新硬件 kernel 已经生成或运行</text></g></svg>