<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1770" viewBox="0 0 1400 1770"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1400" height="1770" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="700" y="45" text-anchor="middle" font-size="29">模板与复合算子接入：按算子、形状与设备条件形成不同 IR</text><rect x="130" y="90" width="1140" height="155" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="700.0" y="126" text-anchor="middle" font-size="23">输入：target + 输入 IR + shape / stride / dtype / device + 编译条件</text><text x="700.0" y="167" text-anchor="middle" font-size="21">专用 lowering 按当前算子和条件分流，下面三项不是必经的三个阶段</text><text x="700.0" y="199" text-anchor="middle" font-size="21">本层交回输出 IR 和分组 / 副作用状态；不直接交回模型数值</text><rect x="25" y="300" width="1350" height="1070" rx="34" fill="#fff9da" stroke="#d7a000" stroke-width="3"/><path d="M700 245 V345 H250 V400" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M700 345 V400" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M700 345 H1150 V400" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="400" width="400" height="295" rx="24" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="250.0" y="436" text-anchor="middle" font-size="23">① 矩阵与卷积的候选接入</text><text x="250.0" y="477" text-anchor="middle" font-size="19">物化 / 整理形状 / 约束布局</text><text x="250.0" y="509" text-anchor="middle" font-size="19">按设备、dtype、架构、库等加候选</text><text x="250.0" y="541" text-anchor="middle" font-size="19">候选携带输入、layout、模板参数</text><text x="250.0" y="573" text-anchor="middle" font-size="19">无候选：按算子规则回退或拒绝</text><text x="250.0" y="605" text-anchor="middle" font-size="19">某些 CPU bmm 改走②</text><rect x="500" y="400" width="400" height="295" rx="24" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="700.0" y="436" text-anchor="middle" font-size="23">② 列表与复合计算</text><text x="700.0" y="477" text-anchor="middle" font-size="19">复用 Pointwise / Reduction 等 IR</text><text x="700.0" y="509" text-anchor="middle" font-size="19">foreach 按位置和设备整理计算</text><text x="700.0" y="541" text-anchor="middle" font-size="19">满足能力与条件才登记 operation list</text><text x="700.0" y="573" text-anchor="middle" font-size="19">返回普通输出及列表 / 写入关系</text><text x="700.0" y="605" text-anchor="middle" font-size="19">不等于已生成 native foreach</text><rect x="950" y="400" width="400" height="295" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="1150.0" y="436" text-anchor="middle" font-size="23">③ 用户 kernel 与专用调用</text><text x="1150.0" y="477" text-anchor="middle" font-size="19">用户描述 / grid / 常量 / Tensor</text><text x="1150.0" y="509" text-anchor="middle" font-size="19">参数顺序、constexpr 与写入分开</text><text x="1150.0" y="541" text-anchor="middle" font-size="19">建立专用 IR 和 MutationOutput</text><text x="1150.0" y="573" text-anchor="middle" font-size="19">effect / collective 还带顺序约束</text><text x="1150.0" y="605" text-anchor="middle" font-size="19">真实执行仍需设备实现</text><path d="M450 590 H500" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="475" y="573" text-anchor="middle" font-size="16">改写</text><rect x="50" y="795" width="400" height="220" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="250.0" y="831" text-anchor="middle" font-size="23">共享：算法选择器</text><text x="250.0" y="872" text-anchor="middle" font-size="19">收到 choices、输入和输出 layout</text><text x="250.0" y="904" text-anchor="middle" font-size="19">外部节点 / 模板 / 可选延迟结果</text><text x="250.0" y="936" text-anchor="middle" font-size="19">本篇 CPP 只有一个候选</text><text x="250.0" y="968" text-anchor="middle" font-size="19">直接 output_node，未 benchmark</text><path d="M250 695 V795" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M250 1015 V1160" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M700 695 V1160" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M1150 695 V1160" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="728" y="886" font-size="19">无需模板选择</text><text x="1177" y="886" font-size="19">尚未启动 kernel</text><rect x="100" y="1160" width="1200" height="155" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="700.0" y="1196" text-anchor="middle" font-size="23">交回共享 GraphLowering 状态，供后续调度使用</text><text x="700.0" y="1237" text-anchor="middle" font-size="21">ExternKernelOut / CppTemplateBuffer 等结果，或普通 ComputedBuffer、专用调用节点</text><text x="700.0" y="1269" text-anchor="middle" font-size="21">输入布局、常量权重、operation list、mutation / effect 关系按本次路径保留</text><text x="700.0" y="1301" text-anchor="middle" font-size="21">当前 CPU 模板权重被预打包，但逻辑输出 shape 仍为 [8,16]</text><rect x="130" y="1440" width="1140" height="160" rx="24" fill="#fff0df" stroke="#dc8d35" stroke-width="3"/><text x="700.0" y="1476" text-anchor="middle" font-size="23">共享：设备调度 / 代码生成 → wrapper → 编译加载</text><text x="700.0" y="1517" text-anchor="middle" font-size="21">接收本层 IR，再生成真实目标 kernel 或外部调用；运行时才产生模型结果</text><text x="700.0" y="1549" text-anchor="middle" font-size="21">登记能力、候选或 grid 不自动补齐新设备的编译器、launcher 和算子</text><text x="700.0" y="1581" text-anchor="middle" font-size="21">本篇七个 CPU 程序实际编译运行；GPU gate / 用户 kernel 仅协议证据</text><path d="M700 1370 V1440" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="700" y="1675" text-anchor="middle" font-size="20">实线：编译期数据交接；横向改写箭头表示形状分支可转入普通复合计算</text><text x="700" y="1730" text-anchor="middle" font-size="20">灰框为共享设施。真实 CPP 模板成功不代表测得加速；本篇成功 CPU 路径均未构造 benchmark</text></g></svg>