<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1160" viewBox="0 0 1100 1160"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1160" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="42" text-anchor="middle" font-size="29">编译装载：JIT 入口与 AOT 产物两条出口</text><text x="550" y="95" text-anchor="middle" font-size="21">输入：生成源码、参数类型、行映射与编译模式</text><rect x="30" y="130" width="1040" height="850" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="220" y="155" width="660" height="110" rx="22" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="550.0" y="191" text-anchor="middle" font-size="23">③ JIT 与 AOT 装载 · 选择出口</text><text x="550.0" y="230" text-anchor="middle" font-size="20">JIT 加载当前进程模块；AOT 返回编译产物路径</text><path d="M550 265 V300 H295 V350" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M550 300 H820 V350" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><text x="190" y="330" text-anchor="middle" font-size="19">JIT</text><text x="930" y="330" text-anchor="middle" font-size="19">AOT</text><rect x="60" y="350" width="470" height="125" rx="22" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="295.0" y="386" text-anchor="middle" font-size="23">② 源码和二进制缓存</text><text x="295.0" y="425" text-anchor="middle" font-size="20">写 Python 源码；按 key/path 加载模块</text><text x="295.0" y="457" text-anchor="middle" font-size="20">后端二进制也由相应缓存服务</text><rect x="600" y="350" width="440" height="240" rx="22" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="820.0" y="386" text-anchor="middle" font-size="23">③ AOT 编译产物出口</text><text x="820.0" y="425" text-anchor="middle" font-size="20">要求相应 C++ wrapper</text><text x="820.0" y="457" text-anchor="middle" font-size="20">处理外部节点序列化等参数</text><text x="820.0" y="489" text-anchor="middle" font-size="20">由 AotCodeCompiler 编译产物</text><text x="820.0" y="521" text-anchor="middle" font-size="20">交出路径，不返回 Python call</text><path d="M295 475 V530" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="60" y="530" width="470" height="140" rx="22" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="295.0" y="566" text-anchor="middle" font-size="23">① 编译任务与等待</text><text x="295.0" y="605" text-anchor="middle" font-size="20">模块顶层提交 kernel 编译 / 加载</text><text x="295.0" y="637" text-anchor="middle" font-size="20">Future 或函数进入 globals</text><text x="295.0" y="669" text-anchor="middle" font-size="20">wait 取得可调用 kernel</text><path d="M295 670 V740" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="60" y="740" width="470" height="125" rx="22" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="295.0" y="776" text-anchor="middle" font-size="23">③ JIT 与 AOT 装载 · JIT 返回</text><text x="295.0" y="815" text-anchor="middle" font-size="20">安装常量和行映射；取得 module.call</text><text x="295.0" y="847" text-anchor="middle" font-size="20">交给 CompiledFxGraph 封装</text><path d="M295 865 V990 H425 V1010" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M820 590 V990 H675 V1010" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="120" y="1010" width="860" height="95" rx="22" fill="#fafafa" stroke="#666" stroke-width="3"/><text x="550.0" y="1046" text-anchor="middle" font-size="23">交回对应出口类型</text><text x="550.0" y="1085" text-anchor="middle" font-size="20">JIT：可调用入口；AOT：编译产物路径</text><text x="550" y="1140" text-anchor="middle" font-size="18">①调用②编译后端文件；图展示出口差别，AOT 不是 JIT 的继续执行</text></g></svg>