<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="880" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="42" text-anchor="middle" font-size="29">物化与副作用：三种需求共享存储实现</text><text x="550" y="95" text-anchor="middle" font-size="22">输入：表达式 / 视图，及输出、复用或写入要求</text><rect x="25" y="135" width="1050" height="500" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="270" y="165" width="560" height="100" rx="22" fill="#fafafa" stroke="#666" stroke-width="3"/><text x="550.0" y="201" text-anchor="middle" font-size="23">按当前需求进入相应处理</text><text x="550.0" y="240" text-anchor="middle" font-size="20">分支不是三个连续的必经步骤</text><path d="M550 265 V300 H205 V355 M550 300 V355 M550 300 H895 V355" fill="none" stroke="#222" stroke-width="3"/><rect x="45" y="355" width="320" height="215" rx="22" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="205" y="391" text-anchor="middle" font-size="19">① 存储实现与复用提示</text><text x="205" y="430" text-anchor="middle" font-size="17">StorageBox.realize / mark_reuse</text><text x="205" y="461" text-anchor="middle" font-size="17">已有存储返回其名字</text><text x="205" y="492" text-anchor="middle" font-size="17">未实现计算登记 ComputedBuffer</text><text x="205" y="523" text-anchor="middle" font-size="17">保留来源；布局可暂为 Flexible</text><path d="M205 320 V355" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="390" y="355" width="320" height="215" rx="22" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="391" text-anchor="middle" font-size="19">② 输出与布局约束</text><text x="550" y="430" text-anchor="middle" font-size="17">实现可返回的输出形式</text><text x="550" y="461" text-anchor="middle" font-size="17">保留 stride 和共享关系要求</text><text x="550" y="492" text-anchor="middle" font-size="17">需要时调用①取得稳定存储</text><text x="550" y="523" text-anchor="middle" font-size="17">登记 graph_outputs 并定型布局</text><path d="M550 320 V355" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="735" y="355" width="320" height="215" rx="22" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="895" y="391" text-anchor="middle" font-size="19">③ 写入与旧值保护</text><text x="895" y="430" text-anchor="middle" font-size="17">检查内部临时量或图输入</text><text x="895" y="461" text-anchor="middle" font-size="17">先调用①保护必要旧值读取</text><text x="895" y="492" text-anchor="middle" font-size="17">建立指向目标的 MutationLayout</text><text x="895" y="523" text-anchor="middle" font-size="17">输入写回保留实际存储身份</text><path d="M895 320 V355" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M205 570 V610 H550 M550 570 V610 M895 570 V610 H550" fill="none" stroke="#222" stroke-width="3"/><path d="M550 610 V680" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="60" y="680" width="980" height="95" rx="22" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="550.0" y="716" text-anchor="middle" font-size="23">交回父图 Lowering 或后续编译阶段</text><text x="550.0" y="755" text-anchor="middle" font-size="20">输出：更新后的 graph.buffers / operations / outputs，交 Scheduler 处理</text><text x="550" y="825" text-anchor="middle" font-size="18">分支是不同触发需求，调用可交错；登记 IR 不等于现在分配真实 Tensor</text><text x="550" y="860" text-anchor="middle" font-size="17">实线为本层交接；同一职责可在一次图遍历中多次参与</text></g></svg>