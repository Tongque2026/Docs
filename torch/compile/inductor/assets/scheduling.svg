<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1030" viewBox="0 0 1100 1030"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1030" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="40" text-anchor="middle" font-size="30">调度与融合：把存储依赖变成生成顺序</text><text x="550" y="95" text-anchor="middle" font-size="23">输入：graph.operations + 输入 / 常量 / 输出状态</text><rect x="45" y="130" width="1010" height="710" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="110" y="155" width="880" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550" y="189" text-anchor="middle" font-size="23">① 依赖与合法顺序</text><text x="550" y="227" text-anchor="middle" font-size="21">构造调度节点；读写、别名、修改依赖</text><text x="550" y="259" text-anchor="middle" font-size="21">拓扑排序；删死节点；计算祖先关系</text><path d="M550 280 V333" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="335" width="880" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="369" text-anchor="middle" font-size="23">② 融合与分组</text><text x="550" y="407" text-anchor="middle" font-size="21">搜索合法组合；交给设备后端判断</text><text x="550" y="439" text-anchor="middle" font-size="21">形成融合节点；处理模板与分组节点</text><path d="M550 460 V513" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="515" width="880" height="125" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="550" y="549" text-anchor="middle" font-size="23">③ 生命周期与生成驱动 · 分析</text><text x="550" y="587" text-anchor="middle" font-size="21">从输出反向计算 last_usage</text><text x="550" y="619" text-anchor="middle" font-size="21">保留输出和必要输入存储</text><path d="M550 640 V693" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="695" width="880" height="125" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="550" y="729" text-anchor="middle" font-size="23">③ 生命周期与生成驱动 · 遍历</text><text x="550" y="767" text-anchor="middle" font-size="21">Scheduler.codegen 按节点调用设备后端</text><text x="550" y="799" text-anchor="middle" font-size="21">发出分配 / 调用 / 释放代码；flush 收尾</text><text x="550" y="935" text-anchor="middle" font-size="21">输出：生成器中的 kernel / wrapper 内容，交代码生成封装完成</text><text x="550" y="982" text-anchor="middle" font-size="18">实线：编译期间交接；同一编号重复出现表示同一模块再次参与</text></g></svg>