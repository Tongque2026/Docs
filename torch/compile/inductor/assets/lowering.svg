<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="950" viewBox="0 0 1100 950"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="950" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="42" text-anchor="middle" font-size="30">Lowering：算子分派、计算与存储交接</text><text x="550" y="94" text-anchor="middle" font-size="21">输入：整理后的 FX 图 + 输入属性 + 图上下文</text><rect x="35" y="130" width="1030" height="660" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="220" y="160" width="660" height="125" rx="22" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550.0" y="196" text-anchor="middle" font-size="23">① 解释图与登记输入</text><text x="550.0" y="235" text-anchor="middle" font-size="20">按节点分派；保存当前节点和 origins</text><text x="550.0" y="267" text-anchor="middle" font-size="20">placeholder → 输入布局 / 符号表达式</text><rect x="65" y="365" width="455" height="170" rx="22" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="292.5" y="401" text-anchor="middle" font-size="23">② 表达计算与布局</text><text x="292.5" y="440" text-anchor="middle" font-size="20">普通点运算、reduction、view</text><text x="292.5" y="472" text-anchor="middle" font-size="20">元素 loader、逻辑索引和布局</text><text x="292.5" y="504" text-anchor="middle" font-size="20">输入或结果需要存储时调用③</text><rect x="580" y="365" width="455" height="170" rx="22" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="807.5" y="401" text-anchor="middle" font-size="23">④ 专用算子路径</text><text x="807.5" y="440" text-anchor="middle" font-size="20">模板、外部调用、控制流</text><text x="807.5" y="472" text-anchor="middle" font-size="20">准备专用 IR 和输入输出约束</text><text x="807.5" y="504" text-anchor="middle" font-size="20">与其他节点通过 IR 值连接</text><path d="M550 285 V320 H292 V365" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M550 320 H807 V365" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><text x="180" y="345" text-anchor="middle" font-size="18">普通算子</text><text x="920" y="345" text-anchor="middle" font-size="17">专用算子 / fallback</text><rect x="220" y="615" width="660" height="130" rx="22" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="550.0" y="651" text-anchor="middle" font-size="23">③ 物化与副作用</text><text x="550.0" y="690" text-anchor="middle" font-size="20">登记 ComputedBuffer / operation；输出实现</text><text x="550.0" y="722" text-anchor="middle" font-size="20">布局定型、输入写回；保留图接口语义</text><path d="M292 535 V574 H425 V615" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M807 535 V574 H675 V615" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><text x="550" y="832" text-anchor="middle" font-size="21">出口：GraphLowering 上的 operations、buffers、graph_outputs</text><text x="550" y="877" text-anchor="middle" font-size="20">逐节点重复分派；一个节点的 IR 结果继续作为后续节点的输入</text><text x="550" y="919" text-anchor="middle" font-size="18">实线：本层处理方向；③也可能在②或④内部因输入要求被调用</text></g></svg>