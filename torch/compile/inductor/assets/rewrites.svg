<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1210" viewBox="0 0 1100 1210"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1210" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="40" text-anchor="middle" font-size="30">图重写：从候选关系到合法替换</text><text x="550" y="95" text-anchor="middle" font-size="23">输入：带 FakeTensor 属性的单图 gm</text><rect x="45" y="130" width="1010" height="890" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="110" y="155" width="880" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550" y="189" text-anchor="middle" font-size="23">① 清理与局部顺序 · 按配置</text><text x="550" y="227" text-anchor="middle" font-size="21">DCE 与推理局部性重排</text><text x="550" y="259" text-anchor="middle" font-size="21">保留图接口和写入区域约束</text><path d="M550 280 V333" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="335" width="880" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="369" text-anchor="middle" font-size="23">④ 批量计算与通信改写 · 批量部分</text><text x="550" y="407" text-anchor="middle" font-size="21">pattern matcher 开启时按规则分组</text><text x="550" y="439" text-anchor="middle" font-size="21">没有配置或候选则保持图不变</text><path d="M550 460 V513" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="515" width="880" height="125" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="550" y="549" text-anchor="middle" font-size="23">② 无效操作与存储边界</text><text x="550" y="587" text-anchor="middle" font-size="21">检查 metadata、算子条件、输入输出别名</text><text x="550" y="619" text-anchor="middle" font-size="21">重接可删除节点的使用者</text><path d="M550 640 V693" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="695" width="880" height="125" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="550" y="729" text-anchor="middle" font-size="23">③ 模式匹配与子图替换</text><text x="550" y="767" text-anchor="middle" font-size="21">按根 target 检索；匹配和 extra_check</text><text x="550" y="799" text-anchor="middle" font-size="21">检查 mutation region 后替换或插入 handler</text><path d="M550 820 V873" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="875" width="880" height="125" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="550" y="909" text-anchor="middle" font-size="23">④ 批量计算与通信改写 · 通信部分</text><text x="550" y="947" text-anchor="middle" font-size="21">按各自开关应用微流水 / DDP 等处理</text><text x="550" y="979" text-anchor="middle" font-size="21">交给共享属性维护和图收尾</text><text x="550" y="1115" text-anchor="middle" font-size="21">输出：同一 gm 上新的算子关系；不是 kernel 或结果 Tensor</text><text x="550" y="1162" text-anchor="middle" font-size="18">实线：编译期间交接；同一编号重复出现表示同一模块再次参与</text><path d="M550 305 H85 V937 H110" fill="none" stroke="#444" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="68" y="680" transform="rotate(-90 68 680)" font-size="17">pattern_matcher=False：跳过批量、noop 与通用模式</text></g></svg>