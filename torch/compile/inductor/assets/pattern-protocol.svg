<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1570" viewBox="0 0 1250 1570"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1250" height="1570" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="625" y="42" text-anchor="middle" font-size="29">模式匹配与子图替换：先收集证据，再应用规则</text><text x="625" y="93" text-anchor="middle" font-size="20">三项职责：① 规则构造与登记　② 模式与匹配状态　③ 候选应用与图维护</text><rect x="35" y="125" width="1180" height="1175" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="120" y="155" width="720" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="480.0" y="188" text-anchor="middle" font-size="22">① 规则构造与登记</text><text x="480.0" y="225" text-anchor="middle" font-size="18">手写 PatternExpr 或追踪 search_fn；建立 entry</text><text x="480.0" y="254" text-anchor="middle" font-size="18">patterns[(op,target)] 保存有顺序的规则</text><rect x="120" y="340" width="720" height="125" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="480.0" y="373" text-anchor="middle" font-size="22">③ 候选应用与图维护：建立本轮候选快照</text><text x="480.0" y="410" text-anchor="middle" font-size="18">当前 FX 图 + patterns → 逆序访问根节点</text><text x="480.0" y="439" text-anchor="middle" font-size="18">每个根按登记顺序尝试 entry</text><rect x="120" y="525" width="720" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="480.0" y="558" text-anchor="middle" font-size="22">② 模式与匹配状态：调用 pattern.match(root)</text><text x="480.0" y="595" text-anchor="middle" font-size="18">递归核对算子、参数、常量、共享节点和用户数</text><text x="480.0" y="624" text-anchor="middle" font-size="18">返回 Match（捕获与节点）或 FailedMatch</text><rect x="120" y="710" width="720" height="140" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="480.0" y="743" text-anchor="middle" font-size="22">③ 候选应用与图维护：检查条件</text><text x="480.0" y="780" text-anchor="middle" font-size="18">Match 跨 mutation region → 拒绝；extra_check=False → 拒绝</text><text x="480.0" y="809" text-anchor="middle" font-size="18">Replacement entry 还可按当前属性重追踪，再生成替代图</text><text x="480.0" y="838" text-anchor="middle" font-size="18">通过后调用 entry.apply；不代表已经执行数值计算</text><path d="M480 280 V340" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><path d="M480 465 V525" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><path d="M480 650 V710" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><text x="480" y="907" text-anchor="middle" font-size="21">entry 类型决定如何改写（都属于③）</text><rect x="75" y="960" width="340" height="150" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="245.0" y="993" text-anchor="middle" font-size="22">GraphPatternEntry</text><text x="245.0" y="1030" text-anchor="middle" font-size="18">调用 handler(match, FX Node)</text><text x="245.0" y="1059" text-anchor="middle" font-size="18">handler 负责图修改和删除</text><text x="245.0" y="1088" text-anchor="middle" font-size="18">可在内部用 replace_by_example</text><rect x="455" y="960" width="340" height="150" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="625.0" y="993" text-anchor="middle" font-size="22">ReplacementPatternEntry</text><text x="625.0" y="1030" text-anchor="middle" font-size="18">复制已追踪 replacement_graph</text><text x="625.0" y="1059" text-anchor="middle" font-size="18">重接输出、传播相关 metadata</text><text x="625.0" y="1088" text-anchor="middle" font-size="18">删除不再使用的旧节点</text><rect x="835" y="960" width="340" height="150" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="1005.0" y="993" text-anchor="middle" font-size="22">LoweringPatternEntry</text><text x="1005.0" y="1030" text-anchor="middle" font-size="18">插入绑定 Match 的 handler</text><text x="1005.0" y="1059" text-anchor="middle" font-size="18">复制根 metadata、重接和删除</text><text x="1005.0" y="1088" text-anchor="middle" font-size="18">此时 handler 尚未构造 IR</text><path d="M480 850 V925 H245 V960" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><path d="M480 925 H625 V960" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><path d="M625 925 H1005 V960" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><rect x="910" y="340" width="270" height="510" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="1045.0" y="373" text-anchor="middle" font-size="22">③ 扫描控制</text><text x="1045.0" y="410" text-anchor="middle" font-size="18">失败，或 A：处理结束</text><text x="1045.0" y="439" text-anchor="middle" font-size="18">继续本轮已有候选</text><text x="1045.0" y="468" text-anchor="middle" font-size="18">新建根不自动追加</text><text x="1045.0" y="497" text-anchor="middle" font-size="18">同一旧根未删除时</text><text x="1045.0" y="526" text-anchor="middle" font-size="18">仍可能尝试后续 entry</text><text x="1045.0" y="555" text-anchor="middle" font-size="18"></text><text x="1045.0" y="584" text-anchor="middle" font-size="18">不自动迭代到不再变化</text><path d="M840 587 H910" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><path d="M840 785 H910" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><path d="M245 1110 V1160 H625 V1190" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><path d="M1005 1110 V1160 H625 V1190" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><path d="M625 1110 V1190" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><text x="625" y="1225" text-anchor="middle" font-size="19">A：entry 处理结束 → 返回右侧扫描控制（配对连接点）</text><path d="M1045 340 V312 H480 V340" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)" stroke-dasharray="8 6"/><text x="625" y="1275" text-anchor="middle" font-size="21">扫描结束：返回应用计数；图已原地修改，调用方负责后续收尾</text><path d="M1175 1070 H1230 V1320 H1005 V1340" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)" stroke-dasharray="8 6"/><rect x="785" y="1340" width="425" height="125" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="997.5" y="1373" text-anchor="middle" font-size="22">稍后：GraphLowering.call_function</text><text x="997.5" y="1410" text-anchor="middle" font-size="18">FX 参数已解释为 TensorBox 等 IR</text><text x="997.5" y="1439" text-anchor="middle" font-size="18">才调用 handler；运行程序不再调用它</text><text x="375" y="1390" text-anchor="middle" font-size="19">虚线：继续候选，或稍后触发</text><text x="375" y="1430" text-anchor="middle" font-size="19">实线：登记、匹配、条件检查与图修改</text><text x="625" y="1525" text-anchor="middle" font-size="20">编译图与执行图分开：lowering handler 的参数契约是 IR，不能当普通 Tensor 算子调用</text></g></svg>