<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1760" viewBox="0 0 1450 1760"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1450" height="1760" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="725" y="45" text-anchor="middle" font-size="28">后端注册与能力查询：两张表，分别交出生成实现与设备代码接口</text><rect x="160" y="90" width="1130" height="120" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="725.0" y="126" text-anchor="middle" font-size="24">输入：设备类型名 + Scheduling / wrapper 实现；或设备操作对象</text><text x="725.0" y="170" text-anchor="middle" font-size="21">登记、默认初始化、精确查表和能力探测，触发条件不同</text><path d="M725 210 V245 H360 V290" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M725 245 H1090 V290" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="290" width="620" height="220" rx="24" fill="#e1f2ff" stroke="#368dc0" stroke-width="3"/><text x="360.0" y="326" text-anchor="middle" font-size="24">后端实现登记与默认初始化</text><text x="360.0" y="370" text-anchor="middle" font-size="21">显式登记直接覆盖同 key</text><text x="360.0" y="402" text-anchor="middle" font-size="21">默认 CPU / CUDA / XPU 仅在 Scheduling 为 None 时补入</text><text x="360.0" y="434" text-anchor="middle" font-size="21">重命名 PrivateUse1：发现三个实现，全部为真才登记</text><text x="360.0" y="466" text-anchor="middle" font-size="21">初始化有 lru_cache；不是每次 getter 都自动初始化</text><rect x="780" y="290" width="620" height="220" rx="24" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="1090.0" y="326" text-anchor="middle" font-size="24">register_device_op_overrides / 默认模块导入</text><text x="1090.0" y="370" text-anchor="middle" font-size="21">显式登记直接保存对象、覆盖同 key</text><text x="1090.0" y="402" text-anchor="middle" font-size="21">lookup 只在整张表为空时导入默认 CUDA / XPU 模块</text><text x="1090.0" y="434" text-anchor="middle" font-size="21">模块导入缓存与对象字典是两套独立状态</text><text x="1090.0" y="466" text-anchor="middle" font-size="21">不执行 set_device / stream / 同步</text><path d="M360 510 V565" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M1090 510 V565" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="565" width="620" height="155" rx="24" fill="#e1f2ff" stroke="#368dc0" stroke-width="3"/><text x="360.0" y="601" text-anchor="middle" font-size="24">device_codegens：类型 key → DeviceCodegen</text><text x="360.0" y="645" text-anchor="middle" font-size="21">scheduling / wrapper_codegen / cpp_wrapper_codegen</text><text x="360.0" y="677" text-anchor="middle" font-size="21">省略 C++ 槽位默认 type(None)，不是可用实现</text><rect x="780" y="565" width="620" height="155" rx="24" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="1090.0" y="601" text-anchor="middle" font-size="24">device_op_overrides_dict：类型 key → 对象</text><text x="1090.0" y="645" text-anchor="middle" font-size="21">保存实际对象引用</text><text x="1090.0" y="677" text-anchor="middle" font-size="21">它与左侧 Scheduling/wrapper 登记没有自动联动</text><path d="M360 720 V780" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M1090 720 V780" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="780" width="620" height="165" rx="24" fill="#e1f2ff" stroke="#368dc0" stroke-width="3"/><text x="360.0" y="816" text-anchor="middle" font-size="24">get_scheduling / get_wrapper_codegen</text><text x="360.0" y="860" text-anchor="middle" font-size="21">精确 key 查表；缺失返回 None</text><text x="360.0" y="892" text-anchor="middle" font-size="21">wrapper 根据 cpp_wrapper 选择槽位</text><text x="360.0" y="924" text-anchor="middle" font-size="21">单独调用这些 getter 不触发默认初始化</text><rect x="780" y="780" width="620" height="165" rx="24" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="1090.0" y="816" text-anchor="middle" font-size="24">get_device_op_overrides</text><text x="1090.0" y="860" text-anchor="middle" font-size="21">已有 key 返回同一对象；缺失隐式返回 None</text><text x="1090.0" y="892" text-anchor="middle" font-size="21">表非空时不会因为缺少某个 key 而导入默认模块</text><text x="1090.0" y="924" text-anchor="middle" font-size="21">清空表也不会自动重执行已导入模块的顶层登记</text><path d="M360 945 V1010" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="205" y="980" text-anchor="middle" font-size="18">能力查询路径</text><path d="M1090 945 V1010" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M670 860 H725 V1260 H360" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><rect x="680" y="955" width="90" height="57" fill="white"/><text x="725" y="978" text-anchor="middle" font-size="16">wrapper 类</text><text x="725" y="1000" text-anchor="middle" font-size="16">直接交出</text><rect x="50" y="1010" width="620" height="225" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="360.0" y="1046" text-anchor="middle" font-size="24">get_backend_features / has_backend_feature</text><text x="360.0" y="1090" text-anchor="middle" font-size="21">先初始化，再取得 Scheduling</text><text x="360.0" y="1122" text-anchor="middle" font-size="21">torch.device 对象用 .type 查表；字符串保留原 key</text><text x="360.0" y="1154" text-anchor="middle" font-size="21">Scheduling(None) → get_backend_features(device)</text><text x="360.0" y="1186" text-anchor="middle" font-size="21">每次能力查询可新建探测实例，不是读取缓存的能力值</text><text x="360.0" y="1218" text-anchor="middle" font-size="21">has_backend_feature 校验 Enum 后做成员查询</text><rect x="780" y="1010" width="620" height="225" rx="24" fill="#fff4ce" stroke="#d6a000" stroke-width="3"/><text x="1090.0" y="1046" text-anchor="middle" font-size="24">交给 wrapper 的代码生成接口</text><text x="1090.0" y="1090" text-anchor="middle" font-size="21">实际对象生成 import / set_device / guard 等字符串</text><text x="1090.0" y="1122" text-anchor="middle" font-size="21">基类四个方法均抛 NotImplementedError</text><text x="1090.0" y="1154" text-anchor="middle" font-size="21">具体字符串与运行调用归 wrapper 设备入口</text><text x="1090.0" y="1186" text-anchor="middle" font-size="21">登记成功不代表设备 Tensor、kernel 或 runtime 已实现</text><path d="M360 1235 V1290 H725 V1350" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M1090 1235 V1290 H725" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><rect x="160" y="1350" width="1130" height="140" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="725.0" y="1386" text-anchor="middle" font-size="24">输出：生成类/工厂、能力集合、设备代码接口对象</text><text x="725.0" y="1430" text-anchor="middle" font-size="21">后续 GraphLowering 与 Scheduler 消费这些对象</text><text x="725.0" y="1462" text-anchor="middle" font-size="21">本层本身没有分配新设备 Tensor，也不编译/执行 kernel</text><text x="725" y="1600" text-anchor="middle" font-size="20">默认 Scheduling 工厂在调用时读取后端配置；初始化缓存不等于冻结所有后续查询结果。</text><text x="725" y="1650" text-anchor="middle" font-size="19">源码、独立进程协议与先前真实 CPU 编译消费证据分别记录；没有新设备硬件运行。</text></g></svg>