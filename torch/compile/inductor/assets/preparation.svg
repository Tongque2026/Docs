<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1210" viewBox="0 0 1100 1210"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1210" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="40" text-anchor="middle" font-size="30">图准备：维护算子关系和张量属性</text><text x="550" y="95" text-anchor="middle" font-size="23">输入：单图 gm + example_inputs</text><rect x="45" y="130" width="1010" height="890" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="110" y="155" width="880" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550" y="189" text-anchor="middle" font-size="23">① 属性与布局描述</text><text x="550" y="227" text-anchor="middle" font-size="21">view → reshape；FakeTensor 传播</text><text x="550" y="259" text-anchor="middle" font-size="21">返回 fake_mode；把张量属性写入节点</text><path d="M550 280 V333" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="335" width="880" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="369" text-anchor="middle" font-size="23">② 图重写</text><text x="550" y="407" text-anchor="middle" font-size="21">DCE、局部性重排、noop 与模式替换</text><text x="550" y="439" text-anchor="middle" font-size="21">可选批量融合 / 通信改写；修改同一张图</text><path d="M550 460 V513" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="515" width="880" height="125" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="550" y="549" text-anchor="middle" font-size="23">④ 图收尾 · 第一次参与</text><text x="550" y="587" text-anchor="middle" font-size="21">稳定拓扑排序；移动构造节点</text><text x="550" y="619" text-anchor="middle" font-size="21">调用①的增量更新，补回改写后的属性</text><path d="M550 640 V693" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="695" width="880" height="125" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="550" y="729" text-anchor="middle" font-size="23">③ 写入语义恢复</text><text x="550" y="767" text-anchor="middle" font-size="21">reinplace 与自动功能化分解</text><text x="550" y="799" text-anchor="middle" font-size="21">在主要功能式改写完成后引入受控写入</text><path d="M550 820 V873" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="875" width="880" height="125" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="550" y="909" text-anchor="middle" font-size="23">④ 图收尾 · 第二次参与</text><text x="550" y="947" text-anchor="middle" font-size="21">gm.recompile()；graph.lint()</text><text x="550" y="979" text-anchor="middle" font-size="21">交出可解释且顺序合法的 gm</text><text x="550" y="1115" text-anchor="middle" font-size="21">输出：整理后的 gm；fake_mode 继续供 Lowering 使用</text><text x="550" y="1162" text-anchor="middle" font-size="18">实线：编译期间交接；同一编号重复出现表示同一模块再次参与</text></g></svg>