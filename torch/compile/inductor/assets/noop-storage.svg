<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1140" viewBox="0 0 1100 1140"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1140" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="42" text-anchor="middle" font-size="29">删除 noop：候选、存储与谓词逐项通过才替换</text><text x="550" y="95" text-anchor="middle" font-size="21">输入：已有 metadata 的 graph；返回 None，原地修改图</text><rect x="35" y="130" width="1040" height="890" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="130" y="155" width="670" height="110" rx="22" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="465" y="189" text-anchor="middle" font-size="23">先收集接口观察</text><text x="465" y="225" text-anchor="middle" font-size="19">输入节点、输入存储、输出存储；保留身份与别名区别</text><rect x="130" y="320" width="670" height="110" rx="22" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="465" y="354" text-anchor="middle" font-size="23">扫描候选并取 src</text><text x="465" y="390" text-anchor="middle" font-size="19">不在 registry 或源不是 FX Node → 右侧</text><text x="465" y="419" text-anchor="middle" font-size="19">固定参数下标，或嵌套参数 selector</text><rect x="130" y="485" width="670" height="110" rx="22" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="465" y="519" text-anchor="middle" font-size="23">检查存储与身份保护</text><text x="465" y="555" text-anchor="middle" font-size="19">新增不允许的输入/输出别名 → 右侧</text><text x="465" y="584" text-anchor="middle" font-size="19">直接 output.args 的身份条件命中 → 右侧</text><rect x="130" y="650" width="670" height="110" rx="22" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="465" y="684" text-anchor="middle" font-size="23">解析参数并检查统一/专用条件</text><text x="465" y="720" text-anchor="middle" font-size="19">缺 metadata、same_meta=False、cond=False → 右侧</text><text x="465" y="749" text-anchor="middle" font-size="19">全部满足才进入替换</text><rect x="130" y="815" width="670" height="110" rx="22" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="465" y="849" text-anchor="middle" font-size="23">重接并删除</text><text x="465" y="885" text-anchor="middle" font-size="19">replace_all_uses_with(src)，再 erase_node</text><text x="465" y="914" text-anchor="middle" font-size="19">只改 graph；调用方之后 recompile</text><path d="M465 265 V320" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><path d="M465 430 V485" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><path d="M465 595 V650" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><path d="M465 760 V815" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><rect x="850" y="365" width="200" height="560" rx="22" fill="#fafafa" stroke="#777" stroke-width="2.5"/><text x="950" y="403" text-anchor="middle" font-size="21">扫描控制</text><text x="950" y="450" text-anchor="middle" font-size="17">拒绝、跳过或删除</text><text x="950" y="484" text-anchor="middle" font-size="17">都继续下一个节点</text><text x="950" y="518" text-anchor="middle" font-size="17">tuple 输出的身份</text><text x="950" y="552" text-anchor="middle" font-size="17">保护需看真实层次</text><text x="950" y="860" text-anchor="middle" font-size="16">扫描结束：返回 None</text><path d="M950 365 V340 H825 V290 H465" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)" stroke-dasharray="7 5"/><path d="M800 375 H850" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><path d="M800 540 H850" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><path d="M800 705 H850" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><path d="M800 870 H850" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><text x="550" y="1057" text-anchor="middle" font-size="19">相同数值、相同 metadata、共享存储与同一 Python 对象是不同判定</text><text x="550" y="1098" text-anchor="middle" font-size="17">实线：本轮处理；虚线：继续扫描。扫描结束后退出，跳过条件写在框内</text></g></svg>