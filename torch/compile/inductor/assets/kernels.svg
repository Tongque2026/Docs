<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="880" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="42" text-anchor="middle" font-size="29">设备 kernel：后端、表达式、专用方案</text><text x="550" y="95" text-anchor="middle" font-size="22">输入：普通调度节点，或专用算子的候选请求</text><rect x="25" y="135" width="1050" height="500" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="270" y="165" width="560" height="100" rx="22" fill="#fafafa" stroke="#666" stroke-width="3"/><text x="550.0" y="201" text-anchor="middle" font-size="23">按当前需求进入相应处理</text><text x="550.0" y="240" text-anchor="middle" font-size="20">分支不是三个连续的必经步骤</text><path d="M550 265 V300 H205 V355 M550 300 V355 M550 300 H895 V355" fill="none" stroke="#222" stroke-width="3"/><rect x="45" y="355" width="320" height="215" rx="22" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="205" y="391" text-anchor="middle" font-size="19">① 后端与循环组织</text><text x="205" y="430" text-anchor="middle" font-size="17">按设备取得 scheduling</text><text x="205" y="461" text-anchor="middle" font-size="17">组织点循环、归约和向量块</text><text x="205" y="492" text-anchor="middle" font-size="17">普通路径继续调用②</text><text x="205" y="523" text-anchor="middle" font-size="17">flush 汇总源码与调用要求</text><path d="M205 320 V355" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="390" y="355" width="320" height="215" rx="22" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="391" text-anchor="middle" font-size="19">② 元素表达式与目标代码</text><text x="550" y="430" text-anchor="middle" font-size="17">解释 ops.load / 计算 / store</text><text x="550" y="461" text-anchor="middle" font-size="17">生成索引、参数与临时变量</text><text x="550" y="492" text-anchor="middle" font-size="17">维护 CSE 和类型语义</text><text x="550" y="523" text-anchor="middle" font-size="17">交回①的目标代码生成区</text><path d="M550 320 V355" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="735" y="355" width="320" height="215" rx="22" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="895" y="391" text-anchor="middle" font-size="19">③ 模板候选与方案选择</text><text x="895" y="430" text-anchor="middle" font-size="17">专用算子先准备合法候选</text><text x="895" y="461" text-anchor="middle" font-size="17">按配置直接选择或调优</text><text x="895" y="492" text-anchor="middle" font-size="17">模板再进对应生成路径</text><text x="895" y="523" text-anchor="middle" font-size="17">外部方案保留库调用</text><path d="M895 320 V355" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M205 570 V610 H550 M550 570 V610 M895 570 V610 H550" fill="none" stroke="#222" stroke-width="3"/><path d="M550 610 V680" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="60" y="680" width="980" height="95" rx="22" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="550.0" y="716" text-anchor="middle" font-size="23">交回父图 Lowering 或后续编译阶段</text><text x="550.0" y="755" text-anchor="middle" font-size="20">输出：kernel 源码、参数和调用要求；运行时 Tensor 分配仍由 wrapper 负责</text><text x="550" y="825" text-anchor="middle" font-size="18">普通路径为①调用②；③可在 Lowering / 调度时参与，不是点运算必经步骤</text><text x="550" y="860" text-anchor="middle" font-size="17">实线为本层交接；同一职责可在一次图遍历中多次参与</text></g></svg>