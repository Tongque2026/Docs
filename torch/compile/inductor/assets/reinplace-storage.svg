<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1420" viewBox="0 0 1300 1420"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1300" height="1420" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="650" y="43" text-anchor="middle" font-size="30">存储可写性与原地化：先检查旧值是否仍会被观察</text><text x="650" y="94" text-anchor="middle" font-size="21">输入：已有 metadata 的 FX 图；输出：修改后的 target、clone 决策与重接关系</text><rect x="25" y="120" width="1250" height="1165" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="200" y="155" width="900" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="650.0" y="190" text-anchor="middle" font-size="23">反向建表：保留原图顺序和存储关系</text><text x="650.0" y="233" text-anchor="middle" font-size="20">node_order、storage_to_nodes；登记输入 / get_attr 的 copy 回写</text><text x="650.0" y="264" text-anchor="middle" font-size="20">同一存储的所有 view 一起参与后续旧值使用检查</text><rect x="200" y="350" width="900" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="650.0" y="385" text-anchor="middle" font-size="23">正向逐节点：按 target 选择处理分支</text><text x="650.0" y="428" text-anchor="middle" font-size="20">can_inplace 检查存储、同存储 view 的后续使用与回写边界</text><text x="650.0" y="459" text-anchor="middle" font-size="20">没有候选的节点直接继续；不是把所有算子改成原地版本</text><rect x="75" y="600" width="350" height="175" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="250.0" y="635" text-anchor="middle" font-size="23">普通候选</text><text x="250.0" y="678" text-anchor="middle" font-size="17">can_inplace 且 extra_check 通过</text><text x="250.0" y="709" text-anchor="middle" font-size="17">更换 target 为原地算子</text><text x="250.0" y="740" text-anchor="middle" font-size="17">登记可删除的 copy</text><text x="250.0" y="771" text-anchor="middle" font-size="17">广义 scatter 使用专门策略</text><rect x="475" y="600" width="350" height="175" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="650.0" y="635" text-anchor="middle" font-size="23">功能化 / Triton 包装</text><text x="650.0" y="678" text-anchor="middle" font-size="17">逐个参数或 base 检查可写性</text><text x="650.0" y="709" text-anchor="middle" font-size="17">同一存储只允许一项复用</text><text x="650.0" y="740" text-anchor="middle" font-size="17">记录仍需 clone 的名单</text><text x="650.0" y="771" text-anchor="middle" font-size="17">交给后续分解消费</text><rect x="875" y="600" width="350" height="175" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="1050.0" y="635" text-anchor="middle" font-size="23">foreach 候选</text><text x="1050.0" y="678" text-anchor="middle" font-size="17">每项都有对应 copy 回写</text><text x="1050.0" y="709" text-anchor="middle" font-size="17">列表存储互不重复且逐项可写</text><text x="1050.0" y="740" text-anchor="middle" font-size="17">替换 foreach target</text><text x="1050.0" y="771" text-anchor="middle" font-size="17">登记各项冗余 copy</text><rect x="200" y="900" width="900" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="650.0" y="935" text-anchor="middle" font-size="23">当前节点结束：保留决策，继续正向扫描</text><text x="650.0" y="978" text-anchor="middle" font-size="20">target / metadata / kwargs 可立即更新；待删除节点先放 replace_dict</text><text x="650.0" y="1009" text-anchor="middle" font-size="20">此处不执行真实 Tensor 运算；包装节点仍需后续分解</text><rect x="200" y="1120" width="900" height="125" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="650.0" y="1155" text-anchor="middle" font-size="23">全部扫描完成：追到替换链终点再重接、删除</text><text x="650.0" y="1198" text-anchor="middle" font-size="20">逐项 replace_all_uses_with，erase_node；正常返回 None</text><text x="650.0" y="1229" text-anchor="middle" font-size="20">普通原地化与包装 clone 决策在同一轮共享存储判断</text><path d="M650 280 V350" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M650 475 V530 H250 V600" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M650 530 V600" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M650 530 H1050 V600" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M250 775 V830 H400 V900" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M650 775 V900" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M1050 775 V830 H900 V900" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><path d="M200 965 H50 V315 H650 V350" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)" stroke-dasharray="8 6"/><text x="105" y="850" text-anchor="middle" font-size="18">继续</text><text x="105" y="880" text-anchor="middle" font-size="18">下一节点</text><path d="M650 1025 V1120" fill="none" stroke="#222" stroke-width="2.8" marker-end="url(#arr)"/><text x="650" y="1080" text-anchor="middle" font-size="19">扫描结束才执行下面的删除</text><text x="650" y="1330" text-anchor="middle" font-size="20">实线：本轮改图；虚线：扫描循环。后续分解把 clone 决策变成实际操作</text><text x="650" y="1380" text-anchor="middle" font-size="20">普通 Tensor 的值相同，不足以证明输入修改、旧值和存储别名语义都正确</text></g></svg>