<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1290" viewBox="0 0 1100 1290"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1290" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="43" text-anchor="middle" font-size="29">批量计算与通信改写：按配置改变图的组织方式</text><text x="550" y="94" text-anchor="middle" font-size="20">输入与输出都是 FX 图；三个模块分别选择适用的改写</text><rect x="35" y="120" width="1030" height="1040" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="85" y="175" width="780" height="155" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="475" y="210" text-anchor="middle" font-size="24">① 同类算子批处理</text><text x="475" y="253" text-anchor="middle" font-size="20">配置 → 规则；按 key 搜索候选，再选互不依赖的子集</text><text x="475" y="284" text-anchor="middle" font-size="20">如多个 relu → 拼接后一次 relu → select 各结果</text><text x="475" y="315" text-anchor="middle" font-size="20">未满阈值、无规则或缺依赖：保留对应计算</text><rect x="85" y="395" width="780" height="115" rx="23" fill="#f4f4f4" stroke="#888" stroke-width="3"/><text x="475" y="430" text-anchor="middle" font-size="24">其他模式 / B2B（不属于本篇三个子模块）</text><text x="475" y="473" text-anchor="middle" font-size="20">处在相同 pattern_matcher 开关内；见图重写篇</text><rect x="85" y="585" width="780" height="155" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="475" y="620" text-anchor="middle" font-size="24">② TP 计算与通信组合</text><text x="475" y="663" text-anchor="middle" font-size="20">开启 _micro_pipeline_tp 才调用</text><text x="475" y="694" text-anchor="middle" font-size="20">匹配 all-gather / reduce-scatter 与相邻 matmul</text><text x="475" y="725" text-anchor="middle" font-size="20">检查后组合为 fused 算子；条件不足则保留</text><rect x="85" y="815" width="780" height="155" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="475" y="850" text-anchor="middle" font-size="24">③ DDP 通信分桶与等待安排</text><text x="475" y="893" text-anchor="middle" font-size="20">开启 _fuse_ddp_communication 才调用</text><text x="475" y="924" text-anchor="middle" font-size="20">按配置顺序执行 pass；分桶/合并与 wait 排序可组合</text><text x="475" y="955" text-anchor="middle" font-size="20">保留通信完成后才能读取对应结果的依赖</text><rect x="85" y="1040" width="780" height="95" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="475" y="1075" text-anchor="middle" font-size="24">返回同一张 graph，继续图准备收尾</text><text x="475" y="1118" text-anchor="middle" font-size="20">本模块不执行多卡通信，也不交出编译后函数</text><path d="M475 150 V175" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><path d="M475 330 V395" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><path d="M475 510 V585" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><path d="M475 740 V815" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><path d="M475 970 V1040" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)"/><path d="M475 150 H1040 V550 H475 V585" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)" stroke-dasharray="8 6"/><text x="946" y="369" text-anchor="middle" font-size="16">pattern_matcher</text><text x="946" y="397" text-anchor="middle" font-size="18">关闭</text><path d="M475 550 H1005 V780 H475 V815" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)" stroke-dasharray="8 6"/><text x="934" y="660" text-anchor="middle" font-size="18">TP 关闭</text><path d="M475 780 H970 V1005 H475 V1040" fill="none" stroke="#222" stroke-width="2.7" marker-end="url(#arr)" stroke-dasharray="8 6"/><text x="914" y="890" text-anchor="middle" font-size="18">DDP 关闭</text><text x="550" y="1200" text-anchor="middle" font-size="19">实线：对应开关开启后的调用次序；虚线：关闭时的旁路</text><text x="550" y="1240" text-anchor="middle" font-size="19">①②③互不要求都有候选；图改写结果仍由后续 Lowering 与运行时消费</text></g></svg>