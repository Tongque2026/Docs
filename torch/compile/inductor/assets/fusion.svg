<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="850" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="40" text-anchor="middle" font-size="30">融合：候选、判定、更新，再决定下一轮</text><text x="550" y="95" text-anchor="middle" font-size="23">输入：带依赖、祖先和循环信息的调度节点</text><rect x="45" y="130" width="1010" height="530" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="110" y="155" width="880" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550" y="189" text-anchor="middle" font-size="23">① 候选与优先级</text><text x="550" y="227" text-anchor="middle" font-size="21">按共享缓冲区等条件找 pair</text><text x="550" y="259" text-anchor="middle" font-size="21">后端优先级与 score 决定尝试顺序</text><path d="M550 280 V333" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="335" width="880" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="369" text-anchor="middle" font-size="23">② 合法性与后端判断</text><text x="550" y="407" text-anchor="middle" font-size="21">当前组重新检查范围、依赖、设备与环</text><text x="550" y="439" text-anchor="middle" font-size="21">按配置确认规模和收益；拒绝则保留原组</text><path d="M550 460 V513" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="515" width="880" height="125" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="550" y="549" text-anchor="middle" font-size="23">③ 合并与分组维护</text><text x="550" y="587" text-anchor="middle" font-size="21">后端 fuse；更新原操作到融合组映射</text><text x="550" y="619" text-anchor="middle" font-size="21">排序和清理依赖；数量变化后进入下一轮</text><text x="550" y="755" text-anchor="middle" font-size="21">输出：仍有完整输出与依赖关系的新 self.nodes；随后分析 last_usage</text><text x="550" y="802" text-anchor="middle" font-size="18">实线：编译期间交接；同一编号重复出现表示同一模块再次参与</text><path d="M990 577 H1030 V140 H550 V155" fill="none" stroke="#444" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="1010" y="580" transform="rotate(-90 1010 580)" font-size="16">数量变化时继续下一轮</text></g></svg>