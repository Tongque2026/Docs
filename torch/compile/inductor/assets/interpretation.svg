<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1120" viewBox="0 0 1100 1120"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1120" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="42" text-anchor="middle" font-size="30">解释图：逐节点分派，保留同一图上下文</text><text x="550" y="95" text-anchor="middle" font-size="21">输入：gm、example_inputs、可选 ShapeEnv</text><rect x="30" y="130" width="1040" height="780" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="220" y="155" width="660" height="115" rx="22" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550.0" y="191" text-anchor="middle" font-size="23">① 图上下文与符号状态</text><text x="550.0" y="230" text-anchor="middle" font-size="20">建立 GraphLowering 和符号 / 输入 / 操作映射</text><text x="550.0" y="262" text-anchor="middle" font-size="20">安装 V.graph、V.fake_mode</text><path d="M550 270 V305" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M550 305 L675 350 L550 395 L425 350 Z" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="550" y="357" text-anchor="middle" font-size="20">下一个 FX 节点</text><rect x="60" y="450" width="455" height="150" rx="22" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="287.5" y="486" text-anchor="middle" font-size="23">② 输入和常量登记</text><text x="287.5" y="525" text-anchor="middle" font-size="20">placeholder → 输入 IR / 符号</text><text x="287.5" y="557" text-anchor="middle" font-size="20">get_attr → Constant / Buffer / 子图</text><text x="287.5" y="589" text-anchor="middle" font-size="20">结果放回当前节点环境</text><rect x="585" y="450" width="455" height="150" rx="22" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="812.5" y="486" text-anchor="middle" font-size="23">③ 节点派发与结果维护 · 派发</text><text x="812.5" y="525" text-anchor="middle" font-size="20">call_function 调相邻 lowering 模块</text><text x="812.5" y="557" text-anchor="middle" font-size="20">output 调相邻物化与副作用模块</text><text x="812.5" y="589" text-anchor="middle" font-size="20">在当前节点与 origins 作用域处理</text><path d="M425 350 H287 V450" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M675 350 H812 V450" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><text x="140" y="420" text-anchor="middle" font-size="18">placeholder / get_attr</text><text x="930" y="420" text-anchor="middle" font-size="18">函数 / output 等</text><rect x="220" y="670" width="660" height="140" rx="22" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="550.0" y="706" text-anchor="middle" font-size="23">③ 节点派发与结果维护 · 收尾</text><text x="550.0" y="745" text-anchor="middle" font-size="20">满足布局、物化与复用要求；登记来源与读者</text><text x="550.0" y="777" text-anchor="middle" font-size="20">处理新增符号与断言；result 留给后续节点</text><path d="M287 600 V630 H425 V670" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M812 600 V630 H675 V670" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M880 740 H1055 V290 H550" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><text x="969" y="325" text-anchor="middle" font-size="17">继续处理节点</text><path d="M550 810 V960" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><text x="760" y="875" text-anchor="middle" font-size="19">全部节点处理完成</text><rect x="120" y="960" width="860" height="95" rx="22" fill="#fafafa" stroke="#666" stroke-width="3"/><text x="550.0" y="996" text-anchor="middle" font-size="23">出口：节点环境中的 IR 值和图上状态</text><text x="550.0" y="1035" text-anchor="middle" font-size="20">graph_inputs、constants、operations、graph_outputs</text><text x="550" y="1090" text-anchor="middle" font-size="18">实线为实际处理方向；右侧独立通道表示逐节点循环</text></g></svg>