<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="850" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="40" text-anchor="middle" font-size="30">生命周期：分析最后使用，驱动生成和释放</text><text x="550" y="95" text-anchor="middle" font-size="23">输入：最终调度节点、图输出、修改名称映射</text><rect x="45" y="130" width="1010" height="530" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="110" y="155" width="880" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550" y="189" text-anchor="middle" font-size="23">① 最后使用分析</text><text x="550" y="227" text-anchor="middle" font-size="21">从输出反向计算 last_usage</text><text x="550" y="259" text-anchor="middle" font-size="21">融合子节点和别名归并为实际存储需求</text><path d="M550 280 V333" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="335" width="880" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="369" text-anchor="middle" font-size="23">② 生成遍历与 flush</text><text x="550" y="407" text-anchor="middle" font-size="21">按节点种类和设备调用后端</text><text x="550" y="439" text-anchor="middle" font-size="21">按需 flush 积累代码；更新已安排操作</text><path d="M550 460 V513" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="515" width="880" height="125" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="550" y="549" text-anchor="middle" font-size="23">③ 释放与局部缓冲区消除</text><text x="550" y="587" text-anchor="middle" font-size="21">由后端 / flush 按需调用；发出释放请求</text><text x="550" y="619" text-anchor="middle" font-size="21">保护输入和修改，消去仅在 kernel 内部使用的存储</text><text x="550" y="755" text-anchor="middle" font-size="21">输出：kernel 与 wrapper 中的生成请求；不是实际运行时内存曲线</text><text x="550" y="802" text-anchor="middle" font-size="18">实线：编译期间交接；同一编号重复出现表示同一模块再次参与</text><path d="M990 577 H1030 V320 H550 V335" fill="none" stroke="#444" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="1010" y="580" transform="rotate(-90 1010 580)" font-size="16">按需处理释放后继续下一节点</text></g></svg>