<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1570" viewBox="0 0 1200 1570"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1200" height="1570" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="600" y="48" font-size="30" text-anchor="middle">入口与设备调用：先生成程序，再执行入口</text><rect x="35" y="85" width="1130" height="1095" rx="30" fill="#fff9db" stroke="#d9a300" stroke-width="3"/><text x="600" y="125" font-size="23" text-anchor="middle">编译阶段：接收有序调度结果、kernel 名称、参数和设备</text><rect x="115" y="155" width="970" height="135" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="600" y="191" font-size="25" text-anchor="middle">① 入口参数与程序装配：准备程序片段</text><text x="600" y="231" font-size="21" text-anchor="middle">选定 wrapper 类与 DeviceOpOverrides；建立缓冲区</text><text x="600" y="262" font-size="21" text-anchor="middle">写 imports / header / call(args) 前缀；尚未执行真实输入</text><rect x="115" y="350" width="970" height="135" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="600" y="386" font-size="25" text-anchor="middle">② 设备上下文与 stream：登记上下文</text><text x="600" y="426" font-size="21" text-anchor="middle">设备切换 → 追加延迟 guard 行；请求 stream 变量</text><text x="600" y="457" font-size="21" text-anchor="middle">按 device + graph 复用获取语句；import 单独去重</text><rect x="115" y="545" width="970" height="135" rx="23" fill="#ffe6e6" stroke="#e55b61" stroke-width="3"/><text x="600" y="581" font-size="25" text-anchor="middle">③ kernel 调用与启动参数：登记调用</text><text x="600" y="621" font-size="21" text-anchor="middle">CPU 普通调用 / Triton .run / CUDA C++ + stream 指针</text><text x="600" y="652" font-size="21" text-anchor="middle">可选：另写编译期 autotune 样例片段；不替代正常调用</text><rect x="115" y="740" width="970" height="125" rx="23" fill="#f1f1f1" stroke="#888" stroke-width="3"/><text x="600" y="776" font-size="25" text-anchor="middle">共享：存储计划与输出处理</text><text x="600" y="816" font-size="21" text-anchor="middle">先规划分配、复用与释放，再解析调用体中的行对象</text><text x="600" y="847" font-size="21" text-anchor="middle">服务整张图；实现归 wrapper 的两个兄弟模块</text><rect x="115" y="925" width="970" height="155" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="600" y="961" font-size="25" text-anchor="middle">① 入口参数与程序装配：汇总并返回源码</text><text x="600" y="1001" font-size="21" text-anchor="middle">合并前缀、调用体、输出返回与后缀，产生源码和行映射</text><text x="600" y="1032" font-size="21" text-anchor="middle">交给编译加载：普通 Python 模块加载时执行 async_compile.wait</text><text x="600" y="1063" font-size="21" text-anchor="middle">定义 call(args)；函数体等待真实调用</text><path d="M600 290 V350" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M600 485 V545" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M600 680 V740" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M600 865 V925" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="600" y="1135" font-size="19" text-anchor="middle">②③由后端按调度顺序重复参与；图示是一段设备调用的主线</text><rect x="115" y="1240" width="970" height="195" rx="23" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="600" y="1276" font-size="25" text-anchor="middle">运行阶段：加载后的 call(args) 收到真实 Tensor</text><text x="600" y="1316" font-size="21" text-anchor="middle">解包输入、args.clear()、绑定符号并检查布局</text><text x="600" y="1347" font-size="21" text-anchor="middle">进入设备 guard → 每次调用获取当前 stream → 启动 kernel</text><text x="600" y="1378" font-size="21" text-anchor="middle">退出上下文并返回输出；clear 列表不会清除 Tensor 数据</text><text x="600" y="1409" font-size="21" text-anchor="middle">GPU 路径本篇验证生成文本与替身协议；CPU 完整编译执行</text><path d="M600 1180 V1240" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="625" y="1215.0" font-size="18">加载后，由调用者触发</text><text x="600" y="1500" font-size="20" text-anchor="middle">实线表示程序生成主线或标注的运行触发；灰框为共享职责</text></g></svg>