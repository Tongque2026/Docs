<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1200" viewBox="0 0 1100 1200"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1200" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="42" text-anchor="middle" font-size="29">初次属性建立：完整函数的分支与副作用</text><text x="550" y="95" text-anchor="middle" font-size="21">输入：gm、example_inputs、force_allow_non_fake_inputs</text><rect x="30" y="130" width="1040" height="1000" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="220" y="155" width="660" height="110" rx="22" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550.0" y="191" text-anchor="middle" font-size="23">view_to_reshape</text><text x="550.0" y="230" text-anchor="middle" font-size="20">查找 aten.view.default，修改同一节点的 target</text><text x="550.0" y="262" text-anchor="middle" font-size="20">不复制 Tensor，也不在这里 recompile</text><path d="M550 265 V320" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="220" y="320" width="660" height="110" rx="22" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="550.0" y="356" text-anchor="middle" font-size="23">fake_tensor_prop：检测 mode</text><text x="550.0" y="395" text-anchor="middle" font-size="20">当前 context / 活动 mode / 输入必须一致</text><text x="550.0" y="427" text-anchor="middle" font-size="20">没有现成 mode 才创建</text><path d="M550 430 V470 H287 V520" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M550 470 H812 V520" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><text x="175" y="495" text-anchor="middle" font-size="18">没有 mode</text><text x="930" y="495" text-anchor="middle" font-size="18">已有 mode</text><rect x="60" y="520" width="455" height="180" rx="22" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="287.5" y="556" text-anchor="middle" font-size="23">创建并转换参数</text><text x="287.5" y="595" text-anchor="middle" font-size="20">新 mode：allow_non_fake_inputs=True</text><text x="287.5" y="627" text-anchor="middle" font-size="20">FakeTensorProp.propagate 转换输入</text><text x="287.5" y="659" text-anchor="middle" font-size="20">传播结果写入 node.meta[&quot;val&quot;]</text><rect x="585" y="520" width="455" height="180" rx="22" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="812.5" y="556" text-anchor="middle" font-size="23">复用并按条件临时放宽</text><text x="812.5" y="595" text-anchor="middle" font-size="20">force=False：nullcontext</text><text x="812.5" y="627" text-anchor="middle" font-size="20">force=True：临时把 allow flag 设为 True</text><text x="812.5" y="659" text-anchor="middle" font-size="20">propagate_dont_convert_inputs</text><path d="M287 700 V750 H425 V810" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M812 700 V750 H675 V810" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="220" y="810" width="660" height="145" rx="22" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="550.0" y="846" text-anchor="middle" font-size="23">成功出口</text><text x="550.0" y="885" text-anchor="middle" font-size="20">返回 fake_mode；属性仍保存在 gm 节点中</text><text x="550.0" y="917" text-anchor="middle" font-size="20">复用分支的临时 flag 在退出上下文后恢复</text><path d="M220 375 H45 V1070 H220" fill="none" stroke="#555" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="220" y="1020" width="660" height="100" rx="22" fill="#fafafa" stroke="#666" stroke-width="3"/><text x="550.0" y="1056" text-anchor="middle" font-size="23">检测到不同 mode：直接抛 AssertionError</text><text x="550.0" y="1095" text-anchor="middle" font-size="20">force=True 不合并环境；不会进入后面的传播</text><text x="550" y="1160" text-anchor="middle" font-size="18">实线为成功路径；虚线为检测冲突出口。传播自身失败也会向调用者抛出</text></g></svg>