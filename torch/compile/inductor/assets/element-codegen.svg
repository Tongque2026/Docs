<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1560" viewBox="0 0 1400 1560"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1400" height="1560" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="700" y="44" text-anchor="middle" font-size="29">元素表达式与目标代码：每个操作经 handler 形成源码与状态</text><rect x="130" y="90" width="1140" height="130" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="700.0" y="126" text-anchor="middle" font-size="24">共享：后端与循环组织</text><text x="700.0" y="167" text-anchor="middle" font-size="21">交入 LoopBody、循环索引、范围、布局与当前 Kernel</text><text x="700.0" y="198" text-anchor="middle" font-size="21">不是传入一批真实 Tensor 元素，返回值也不是模型数值</text><rect x="130" y="280" width="1140" height="160" rx="24" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="700.0" y="316" text-anchor="middle" font-size="24">① ops 解释与类型语义</text><text x="700.0" y="357" text-anchor="middle" font-size="21">LoopBody 内部 FX 图在当前 ops handler 下逐节点解释</text><text x="700.0" y="388" text-anchor="middle" font-size="21">OpsWrapper / OpsValue 保留编译期运算接口；目标 overrides 与 dtype 信息参与生成</text><text x="700.0" y="419" text-anchor="middle" font-size="21">同一个动作可能同时用到下面多个职责</text><path d="M700 220 V280" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M700 440 V495 H250 V550" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M700 495 V550" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M700 495 H1150 V550" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="550" width="400" height="225" rx="24" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="250.0" y="586" text-anchor="middle" font-size="24">普通运算：① → ③</text><text x="250.0" y="627" text-anchor="middle" font-size="19">① 目标 overrides 返回表达式</text><text x="250.0" y="658" text-anchor="middle" font-size="19">③ CSE 查表达式缓存、命名</text><text x="250.0" y="689" text-anchor="middle" font-size="19">首次写 compute；命中复用临时值</text><text x="250.0" y="720" text-anchor="middle" font-size="19">返回 CSEVariable 给解释器</text><rect x="500" y="550" width="400" height="225" rx="24" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="700.0" y="586" text-anchor="middle" font-size="24">加载：③ → ② → ③</text><text x="700.0" y="627" text-anchor="middle" font-size="19">③ 先查写后读缓存</text><text x="700.0" y="658" text-anchor="middle" font-size="19">命中：直接返回已有临时值</text><text x="700.0" y="689" text-anchor="middle" font-size="19">未命中：② 参数 / 地址 / mask</text><text x="700.0" y="720" text-anchor="middle" font-size="19">③ 记录加载代码和临时值</text><rect x="950" y="550" width="400" height="225" rx="24" fill="#fff0cf" stroke="#d8a000" stroke-width="3"/><text x="1150.0" y="586" text-anchor="middle" font-size="24">写出：③ → ② / 跳过</text><text x="1150.0" y="627" text-anchor="middle" font-size="19">③ 登记写缓存与 buffer 名称</text><text x="1150.0" y="658" text-anchor="middle" font-size="19">② 发出目标 store / atomic 等</text><text x="1150.0" y="689" text-anchor="middle" font-size="19">已移除 buffer：可跳过实际写出</text><text x="1150.0" y="720" text-anchor="middle" font-size="19">保留后续失效与生命周期所需状态</text><path d="M250 775 V840 H1150 V775 M700 775 V840" fill="none" stroke="#222" stroke-width="3"/><path d="M700 840 V900" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><rect x="130" y="900" width="1140" height="195" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="700.0" y="936" text-anchor="middle" font-size="24">③ 临时值复用与生成区：持续积累状态</text><text x="700.0" y="977" text-anchor="middle" font-size="21">上述分派对 LoopBody 各节点重复；需要时将临时值交回解释器</text><text x="700.0" y="1008" text-anchor="middle" font-size="21">loads / compute / stores、参数使用、store cache、must_keep 等状态随之改变</text><text x="700.0" y="1039" text-anchor="middle" font-size="21">作用域结束要处理缓存失效与局部 buffer；不能把复用当全局内存缓存</text><text x="700.0" y="1070" text-anchor="middle" font-size="21">共享 exp 案例：buf0 → tmp1 转发，最终只保留两个图输出写出</text><rect x="130" y="1160" width="1140" height="165" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="700.0" y="1196" text-anchor="middle" font-size="24">共享：循环 / 函数封装 → wrapper → 编译加载</text><text x="700.0" y="1237" text-anchor="middle" font-size="21">CPU 将生成区插入循环；Triton 还组织块、mask 与归约作用域</text><text x="700.0" y="1268" text-anchor="middle" font-size="21">本层交付源码片段与参数状态；后续生成完整入口才接收真实输入</text><text x="700.0" y="1299" text-anchor="middle" font-size="21">当前 CPU 低精度往返案例出现中间舍入差异，正文单独保留对照</text><path d="M700 1095 V1160" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="700" y="1400" text-anchor="middle" font-size="21">三个直接子模块：① ops 解释与类型语义　② 参数索引与访存　③ 临时值复用与生成区</text><text x="700" y="1460" text-anchor="middle" font-size="20">实线：生成期分派与状态交接；三条操作路径不是整段循环依次经过的三个阶段</text><text x="700" y="1510" text-anchor="middle" font-size="20">CPU：实际编译执行。Triton：表达式 / 元信息验证。TextKernel：明确的文本协议实验</text></g></svg>