<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1040" viewBox="0 0 1100 1040"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1040" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="42" text-anchor="middle" font-size="29">清理与局部顺序：按边界遍历，不跨未就绪使用者</text><text x="550" y="95" text-anchor="middle" font-size="21">输入为有效 FX 图；不在这里执行真实 Tensor 数值</text><rect x="35" y="130" width="1040" height="790" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="130" y="155" width="670" height="110" rx="22" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="465" y="189" text-anchor="middle" font-size="23">入口条件</text><text x="465" y="225" text-anchor="middle" font-size="19">DCE 开关决定清理；推理且重排开关开启才继续</text><rect x="130" y="320" width="670" height="110" rx="22" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="465" y="354" text-anchor="middle" font-size="23">建立扫描状态</text><text x="465" y="390" text-anchor="middle" font-size="19">查首个 copy_；seen_nodes 为空</text><text x="465" y="419" text-anchor="middle" font-size="19">有 copy 时先跳过它及之后的尾部</text><rect x="130" y="485" width="670" height="110" rx="22" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="465" y="519" text-anchor="middle" font-size="23">逆向取得当前节点</text><text x="465" y="555" text-anchor="middle" font-size="19">加入 seen；尾部仍未越过 → 右侧</text><text x="465" y="584" text-anchor="middle" font-size="19">前缀节点继续递归访问 args / kwargs</text><rect x="130" y="650" width="670" height="140" rx="22" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="465" y="684" text-anchor="middle" font-size="23">对每个输入节点运行 visit</text><text x="465" y="720" text-anchor="middle" font-size="19">函数计算、非 getitem、所有用户已见、同一 region</text><text x="465" y="749" text-anchor="middle" font-size="19">全满足才 prepend；其余参数仍逐项检查</text><path d="M465 265 V320" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><path d="M465 430 V485" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><path d="M465 595 V650" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><rect x="850" y="365" width="200" height="425" rx="22" fill="#fafafa" stroke="#777" stroke-width="2.5"/><text x="950" y="403" text-anchor="middle" font-size="21">扫描控制</text><text x="950" y="450" text-anchor="middle" font-size="17">当前节点完成后</text><text x="950" y="484" text-anchor="middle" font-size="17">继续逆向下一节点</text><text x="950" y="518" text-anchor="middle" font-size="17">visit 只改链表</text><text x="950" y="552" text-anchor="middle" font-size="17">不改算子参数</text><text x="950" y="725" text-anchor="middle" font-size="16">扫描结束：返回 None</text><path d="M950 365 V340 H825 V460 H465" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)" stroke-dasharray="7 5"/><path d="M800 540 H850" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><path d="M800 720 H850" fill="none" stroke="#333" stroke-width="2.6" marker-end="url(#arr)"/><text x="550" y="957" text-anchor="middle" font-size="19">没有 copy 时检查全图；区域号保护仍独立生效，DCE 使用另一纯度接口</text><text x="550" y="998" text-anchor="middle" font-size="17">实线：本轮处理；虚线：继续扫描。扫描结束后退出，跳过条件写在框内</text></g></svg>