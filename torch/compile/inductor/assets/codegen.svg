<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1030" viewBox="0 0 1100 1030"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="1030" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="40" text-anchor="middle" font-size="30">代码生成：组装并加载图的程序</text><text x="550" y="95" text-anchor="middle" font-size="23">输入：调度节点、IR 布局、图输入输出和配置</text><rect x="45" y="130" width="1010" height="710" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="110" y="155" width="880" height="125" rx="23" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="550" y="189" text-anchor="middle" font-size="23">① 设备 kernel 与方案选择</text><text x="550" y="227" text-anchor="middle" font-size="21">普通计算 / 模板 / 外部算子调用</text><text x="550" y="259" text-anchor="middle" font-size="21">生成后端源码；按配置选择或调优方案</text><path d="M550 280 V333" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="335" width="880" height="125" rx="23" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="369" text-anchor="middle" font-size="23">② Wrapper 与存储计划</text><text x="550" y="407" text-anchor="middle" font-size="21">把分配、调用、释放、返回串成图入口</text><text x="550" y="439" text-anchor="middle" font-size="21">保留布局、别名、写入与设备语义</text><path d="M550 460 V513" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="515" width="880" height="125" rx="23" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="550" y="549" text-anchor="middle" font-size="23">③ 编译与加载</text><text x="550" y="587" text-anchor="middle" font-size="21">提交并等待编译；缓存生成模块</text><text x="550" y="619" text-anchor="middle" font-size="21">JIT：module.call；AOT：编译产物路径</text><path d="M550 640 V693" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="110" y="695" width="880" height="125" rx="23" fill="#ffe4e4" stroke="#ef5555" stroke-width="3"/><text x="550" y="729" text-anchor="middle" font-size="23">④ 缓存与运行适配</text><text x="550" y="767" text-anchor="middle" font-size="21">入口先查 FX 图缓存，命中可跳过重新生成</text><text x="550" y="799" text-anchor="middle" font-size="21">CompiledFxGraph：恢复程序并作运行适配</text><text x="550" y="935" text-anchor="middle" font-size="21">返回可调用程序；之后真实输入 → wrapper → kernel / 外部调用 → 输出</text><text x="550" y="982" text-anchor="middle" font-size="18">实线：编译期间交接；同一编号重复出现表示同一模块再次参与</text><text x="550" y="1012" text-anchor="middle" font-size="18">缓存查询发生在生成前；此图展示未命中后的组装主线，缓存旁路见总图</text></g></svg>