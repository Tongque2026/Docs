<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="880" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="42" text-anchor="middle" font-size="29">表达计算与布局：给索引，取得值或映射</text><text x="550" y="95" text-anchor="middle" font-size="22">输入：当前算子 target、IR 输入与参数</text><rect x="25" y="135" width="1050" height="500" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="270" y="165" width="560" height="100" rx="22" fill="#fafafa" stroke="#666" stroke-width="3"/><text x="550.0" y="201" text-anchor="middle" font-size="23">按当前需求进入相应处理</text><text x="550.0" y="240" text-anchor="middle" font-size="20">分支不是三个连续的必经步骤</text><path d="M550 265 V300 H205 V355 M550 300 V355 M550 300 H895 V355" fill="none" stroke="#222" stroke-width="3"/><rect x="45" y="355" width="320" height="215" rx="22" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="205" y="391" text-anchor="middle" font-size="19">① 点表达式与类型处理</text><text x="205" y="430" text-anchor="middle" font-size="17">按规则提升 dtype / 处理标量</text><text x="205" y="461" text-anchor="middle" font-size="17">取得输入 loader 与 ranges</text><text x="205" y="492" text-anchor="middle" font-size="17">组合为 Pointwise.inner_fn</text><text x="205" y="523" text-anchor="middle" font-size="17">广播时调用②</text><path d="M205 320 V355" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="390" y="355" width="320" height="215" rx="22" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="391" text-anchor="middle" font-size="19">② View、广播与布局索引</text><text x="550" y="430" text-anchor="middle" font-size="17">重排逻辑 index 或建立新 layout</text><text x="550" y="461" text-anchor="middle" font-size="17">expand 的复用维 stride 可为 0</text><text x="550" y="492" text-anchor="middle" font-size="17">已有存储可建 ReinterpretView</text><text x="550" y="523" text-anchor="middle" font-size="17">继续引用原输入或表达式</text><path d="M550 320 V355" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="735" y="355" width="320" height="215" rx="22" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="895" y="391" text-anchor="middle" font-size="19">③ 归约与扫描</text><text x="895" y="430" text-anchor="middle" font-size="17">分开输出维与归约 / 扫描维</text><text x="895" y="461" text-anchor="middle" font-size="17">组合 index 与 reduction_index</text><text x="895" y="492" text-anchor="middle" font-size="17">选择展开或结构化的计算 IR</text><text x="895" y="523" text-anchor="middle" font-size="17">调用输入 loader 和布局机制</text><path d="M895 320 V355" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M205 570 V610 H550 M550 570 V610 M895 570 V610 H550" fill="none" stroke="#222" stroke-width="3"/><path d="M550 610 V680" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="60" y="680" width="980" height="95" rx="22" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="550.0" y="716" text-anchor="middle" font-size="23">交回父图 Lowering 或后续编译阶段</text><text x="550.0" y="755" text-anchor="middle" font-size="20">输出：Pointwise / View / Reduction / Scan 等 IR；有存储要求时交物化模块</text><text x="550" y="825" text-anchor="middle" font-size="18">三个分支按算子语义选择；②的索引机制也被其他分支调用</text><text x="550" y="860" text-anchor="middle" font-size="17">实线为本层交接；同一职责可在一次图遍历中多次参与</text></g></svg>