<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1810" viewBox="0 0 1400 1810"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1400" height="1810" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="700" y="45" text-anchor="middle" font-size="28">源码和二进制缓存：同一个键，区分文件存在与当前进程已装载</text><rect x="80" y="90" width="1090" height="115" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="625" y="126" text-anchor="middle" font-size="25">输入：源码 + 后端 / 编译条件 + 期望产物类型</text><text x="625" y="168" text-anchor="middle" font-size="22">调用者来自 AsyncCompile、生成模块加载，或 AOT 编译</text><rect x="80" y="260" width="1090" height="150" rx="24" fill="#e4f5e4" stroke="#40a147" stroke-width="3"/><text x="625" y="296" text-anchor="middle" font-size="25">② 编译条件与锁内构建：先准备键所需的条件</text><text x="625" y="338" text-anchor="middle" font-size="22">CPU C++：占位路径编译命令含 ISA / extra_flags 等</text><text x="625" y="370" text-anchor="middle" font-size="22">CUDA / ROCm：各自生成编译命令；条件覆盖以实际 write 调用为准</text><rect x="80" y="465" width="1090" height="160" rx="24" fill="#e1f2ff" stroke="#368dc0" stroke-width="3"/><text x="625" y="501" text-anchor="middle" font-size="25">① 缓存键、路径与原子写入</text><text x="625" y="543" text-anchor="middle" font-size="22">write 以 content.strip() 与 extra 等生成 key，扩展名和目录形成路径</text><text x="625" y="575" text-anchor="middle" font-size="22">源文件不存在 → 同目录临时写入后 rename；存在 → 复用</text><text x="625" y="607" text-anchor="middle" font-size="22">路径命中不表示已得到当前进程函数</text><rect x="80" y="680" width="1090" height="150" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="625" y="716" text-anchor="middle" font-size="25">③ 后端产物与进程内复用：检查已有记录</text><text x="625" y="758" text-anchor="middle" font-size="22">C++：key → 取得库的闭包，闭包可保存已装载 lib</text><text x="625" y="790" text-anchor="middle" font-size="22">CUDA / ROCm：key → input/output 路径；不是已打开 DLL</text><rect x="80" y="890" width="1090" height="175" rx="24" fill="#e4f5e4" stroke="#40a147" stroke-width="3"/><text x="625" y="926" text-anchor="middle" font-size="25">② 编译条件与锁内构建：需要时检查磁盘产物</text><text x="625" y="968" text-anchor="middle" font-size="22">CPU 示例：持有 key.lock 后再次检查二进制</text><text x="625" y="1000" text-anchor="middle" font-size="22">已存在 → 复用；缺失 → 调用对应编译器形成产物</text><text x="625" y="1032" text-anchor="middle" font-size="22">并发等待者拿到锁后再检查，避免重复构建同一产物</text><rect x="80" y="1125" width="1090" height="170" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="625" y="1161" text-anchor="middle" font-size="25">③ 后端产物与进程内复用：按调用协议取结果</text><text x="625" y="1203" text-anchor="middle" font-size="22">C++：等待已提交任务，再确认产物，当前进程装载并保留 lib</text><text x="625" y="1235" text-anchor="middle" font-size="22">CUDA / ROCm compile → 路径元组；load → 新 DLLWrapper</text><text x="625" y="1267" text-anchor="middle" font-size="22">Python 模块 / Triton 描述与 Halide 产物有各自缓存协议</text><rect x="80" y="1370" width="1090" height="140" rx="24" fill="#fff4cf" stroke="#d6a000" stroke-width="3"/><text x="625" y="1406" text-anchor="middle" font-size="25">输出：源码路径 / 二进制路径，或当前进程可用对象</text><text x="625" y="1448" text-anchor="middle" font-size="22">交还 AsyncCompile / JIT-AOT 装载；不返回模型的 Tensor 答案</text><text x="625" y="1480" text-anchor="middle" font-size="22">模型计算由之后的 wrapper 调用执行</text><path d="M625 205 V260" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 410 V465" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 625 V680" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 830 V890" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 1065 V1125" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M625 1295 V1370" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><path d="M1170 755 H1230 V1210 H1170" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="1250" y="925" font-size="18">已装载 /</text><text x="1250" y="955" font-size="18">已完成记录：</text><text x="1250" y="985" font-size="18">按后端</text><text x="1250" y="1015" font-size="18">取结果</text><rect x="80" y="1575" width="1090" height="115" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="625" y="1611" text-anchor="middle" font-size="25">边界：三个职责会被反复调用，不是只执行一次的三个阶段</text><text x="625" y="1653" text-anchor="middle" font-size="22">共享任务池由“编译任务与等待”拥有；JIT / AOT 最终出口由相邻模块拥有</text><text x="700" y="1760" text-anchor="middle" font-size="19">CPU 锁与装载主线已真实执行；GPU 路径解释来自源码及明确 fixture，不表示设备编译已运行。</text></g></svg>