<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1770" viewBox="0 0 1300 1770"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1300" height="1770" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="650" y="45" text-anchor="middle" font-size="30">融合合法性与后端判断：允许生成，不等于已经合组</text><rect x="110" y="90" width="1080" height="125" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="650" y="126" text-anchor="middle" font-size="25">共享：候选选择 / 当前组映射</text><text x="650" y="167" text-anchor="middle" font-size="21">两个当前调度组：设备、读写、祖先、循环范围与节点顺序</text><text x="650" y="198" text-anchor="middle" font-size="21">搜索时先过滤；消费候选时映射到当前组，再次判断</text><rect x="45" y="265" width="1210" height="590" rx="32" fill="#fff9da" stroke="#d7a000" stroke-width="3"/><text x="80" y="300" font-size="22">Scheduler.can_fuse 的范围</text><rect x="110" y="325" width="1080" height="195" rx="24" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="650" y="361" text-anchor="middle" font-size="25">① 通用约束与读写匹配</text><text x="650" y="402" text-anchor="middle" font-size="21">类型 / 模板 / 禁融名称 / 完整设备 / 共享数据 / 规模</text><text x="650" y="433" text-anchor="middle" font-size="21">纵向：读写匹配并排除中间节点；横向：检查距离策略</text><text x="650" y="464" text-anchor="middle" font-size="21">配置允许时，共享数据检查可能重排循环，修改节点</text><text x="650" y="495" text-anchor="middle" font-size="21">拒绝 → 返回 False；本候选不进入后端或不再继续</text><rect x="110" y="590" width="1080" height="165" rx="24" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="650" y="626" text-anchor="middle" font-size="25">② 设备融合判断</text><text x="650" y="667" text-anchor="middle" font-size="21">纵向 hook 或横向 hook：CPU 范围、SIMD 迭代 / 归约 / tiling</text><text x="650" y="698" text-anchor="middle" font-size="21">新设备必须给出与自身 codegen 一致的判断</text><text x="650" y="729" text-anchor="middle" font-size="21">返回 False → 停止本候选；缺失基类 hook → NotImplementedError</text><text x="650" y="810" text-anchor="middle" font-size="22">can_fuse=True：只完成这两个职责，尚未调用 backend.fuse</text><path d="M650 215 V325" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="676" y="276.0" font-size="18">当前组</text><path d="M650 520 V590" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="676" y="561.0" font-size="18">通过</text><rect x="110" y="925" width="1080" height="165" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="650" y="961" text-anchor="middle" font-size="25">③ 环检测与融合收益：先检查新增依赖环</text><text x="650" y="1002" text-anchor="middle" font-size="21">will_fusion_create_cycle 沿原 operation → 当前融合组映射查路径</text><text x="650" y="1033" text-anchor="middle" font-size="21">已有合组可能带来原 ancestors 中没有的路径</text><text x="650" y="1064" text-anchor="middle" font-size="21">发现环 → 拒绝，保留已有合法分组</text><path d="M650 855 V925" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="676" y="896.0" font-size="18">can_fuse=True</text><rect x="110" y="1160" width="1080" height="165" rx="24" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="650" y="1196" text-anchor="middle" font-size="25">③ 环检测与融合收益：再判断是否值得合并</text><text x="650" y="1237" text-anchor="middle" font-size="21">speedup_by_fusion：普通关闭测时路径允许；另有模板分支</text><text x="650" y="1268" text-anchor="middle" font-size="21">CPU 等路径即使配置开启也可跳过；本篇没有 GPU 测时</text><text x="650" y="1299" text-anchor="middle" font-size="21">收益不满足 → 拒绝；通过才交给合组模块</text><path d="M650 1090 V1160" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="676" y="1131.0" font-size="18">没有环</text><rect x="110" y="1395" width="1080" height="155" rx="24" fill="#f2f2f2" stroke="#888" stroke-width="3"/><text x="650" y="1431" text-anchor="middle" font-size="25">共享：合并与分组维护</text><text x="650" y="1472" text-anchor="middle" font-size="21">调用 backend.fuse，替换节点，更新原操作到新组映射</text><text x="650" y="1503" text-anchor="middle" font-size="21">重新排序与清理依赖，供下一候选 / 下一轮继续使用</text><text x="650" y="1534" text-anchor="middle" font-size="21">本篇 CPU 对照：允许为 1 组，显式后端否决保留 2 组</text><path d="M650 1325 V1395" fill="none" stroke="#222" stroke-width="3" marker-end="url(#a)"/><text x="676" y="1366.0" font-size="18">通过</text><text x="650" y="1620" text-anchor="middle" font-size="21">任一拒绝只结束当前候选；继续处理其他候选。异常不是普通 False</text><text x="650" y="1680" text-anchor="middle" font-size="20">实线：成功主线；框内标明失败出口。合组后的对象仍是编译状态，不是运行结果</text><text x="650" y="1730" text-anchor="middle" font-size="20">协议 / SIMD 案例使用明确元信息 fixture；四个 CPU 案例实际完整编译执行</text></g></svg>