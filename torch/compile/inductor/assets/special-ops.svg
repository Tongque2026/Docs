<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1100" height="880" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#222"><text x="550" y="42" text-anchor="middle" font-size="29">专用算子：调用协议、模板或结构化子图</text><text x="550" y="95" text-anchor="middle" font-size="22">输入：专用算子 target、IR 参数和图上下文</text><rect x="25" y="135" width="1050" height="500" rx="35" fill="#fff9d9" stroke="#d9a300" stroke-width="3"/><rect x="270" y="165" width="560" height="100" rx="22" fill="#fafafa" stroke="#666" stroke-width="3"/><text x="550.0" y="201" text-anchor="middle" font-size="23">按当前需求进入相应处理</text><text x="550.0" y="240" text-anchor="middle" font-size="20">分支不是三个连续的必经步骤</text><path d="M550 265 V300 H205 V355 M550 300 V355 M550 300 H895 V355" fill="none" stroke="#222" stroke-width="3"/><rect x="45" y="355" width="320" height="215" rx="22" fill="#e3f3ff" stroke="#368dc0" stroke-width="3"/><text x="205" y="391" text-anchor="middle" font-size="19">① 外部调用与 fallback 协议</text><text x="205" y="430" text-anchor="middle" font-size="17">实现输入；Fake 推导输出描述</text><text x="205" y="461" text-anchor="middle" font-size="17">建立 packed 调用与输出路径</text><text x="205" y="492" text-anchor="middle" font-size="17">记录 schema、别名和修改</text><text x="205" y="523" text-anchor="middle" font-size="17">MultiOutput 可共享同一次调用</text><path d="M205 320 V355" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="390" y="355" width="320" height="215" rx="22" fill="#e5f6e5" stroke="#40a147" stroke-width="3"/><text x="550" y="391" text-anchor="middle" font-size="19">② 模板与复合算子接入</text><text x="550" y="430" text-anchor="middle" font-size="17">按设备、形状和配置准备方案</text><text x="550" y="461" text-anchor="middle" font-size="17">连接模板、外部实现与布局</text><text x="550" y="492" text-anchor="middle" font-size="17">选择器细节归代码生成模块</text><text x="550" y="523" text-anchor="middle" font-size="17">外部方案使用①对应协议</text><path d="M550 320 V355" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="735" y="355" width="320" height="215" rx="22" fill="#fff3c9" stroke="#dca300" stroke-width="3"/><text x="895" y="391" text-anchor="middle" font-size="19">③ 条件与循环子图</text><text x="895" y="430" text-anchor="middle" font-size="17">为分支或 cond/body 降低子图</text><text x="895" y="461" text-anchor="middle" font-size="17">核对父图与子图的输出接口</text><text x="895" y="492" text-anchor="middle" font-size="17">登记 Conditional / WhileLoop</text><text x="895" y="523" text-anchor="middle" font-size="17">保留 MultiOutput 与复用限制</text><path d="M895 320 V355" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><path d="M205 570 V610 H550 M550 570 V610 M895 570 V610 H550" fill="none" stroke="#222" stroke-width="3"/><path d="M550 610 V680" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arr)"/><rect x="60" y="680" width="980" height="95" rx="22" fill="#f0e5ff" stroke="#9959c6" stroke-width="3"/><text x="550.0" y="716" text-anchor="middle" font-size="23">交回父图 Lowering 或后续编译阶段</text><text x="550.0" y="755" text-anchor="middle" font-size="20">输出：专用操作和其 IR 输出，交回普通节点环境，继续整张图编译</text><text x="550" y="825" text-anchor="middle" font-size="18">编译子图不等于立即执行子图；运行时再选择分支或重复循环</text><text x="550" y="860" text-anchor="middle" font-size="17">实线为本层交接；同一职责可在一次图遍历中多次参与</text></g></svg>